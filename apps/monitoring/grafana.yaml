# ── Grafana admin password secret — create before deploying: ──────────────────
#
#   kubectl create secret generic grafana-admin-creds \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password='YOUR_SECURE_PASSWORD' \
#     -n monitoring
#
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        jsonData:
          timeInterval: 30s
          httpMethod: POST
      - name: Loki
        type: loki
        uid: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        jsonData:
          maxLines: 1000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: monitoring
data:
  providers.yaml: |
    apiVersion: 1
    providers:
      - name: default
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsNonRoot: true
      containers:
        - name: grafana
          image: grafana/grafana:13.2.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-creds
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-creds
                  key: admin-password
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: "%(protocol)s://%(domain)s/"
            # SQLite WAL mode — prevents SQLITE_BUSY lock contention when
            # Grafana's internal concurrent job drivers write simultaneously.
            - name: GF_DATABASE_WAL
              value: "true"
            # SQLite lock retries. Grafana 13's unified storage runs several
            # concurrent job drivers against the same file; on slow node storage
            # they collide and surface as SQLITE_BUSY. Defaults are far too low
            # (query_retries=0, transaction_retries=5).
            - name: GF_DATABASE_QUERY_RETRIES
              value: "5"
            - name: GF_DATABASE_TRANSACTION_RETRIES
              value: "20"
            # Disable the background plugin installer. In a container the
            # bundled plugin path (/usr/share/grafana/data/plugins-bundled/)
            # is owned by root and not writable by the grafana user (472),
            # so the installer always fails with "permission denied".
            # plugin_admin_enabled alone does NOT stop it — preinstall does.
            - name: GF_PLUGINS_PLUGIN_ADMIN_ENABLED
              value: "false"
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
          ports:
            - containerPort: 3000
              name: web
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          # Readiness uses /api/health (includes a DB check) so traffic is only
          # sent to a Grafana that can actually serve queries.
          readinessProbe:
            httpGet:
              path: /api/health
              port: web
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          # Liveness uses /healthz, which returns 200 without touching SQLite.
          # /api/health blocks on the DB, so a lock storm used to time out the
          # probe and get the container killed — which made the contention worse
          # on restart. Only restart when the process is genuinely wedged.
          livenessProbe:
            httpGet:
              path: /healthz
              port: web
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-storage
              mountPath: /var/lib/grafana/dashboards
            - name: alerting
              mountPath: /etc/grafana/provisioning/alerting
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-providers
          configMap:
            name: grafana-dashboard-providers
        - name: dashboard-storage
          emptyDir: {}
        - name: alerting
          configMap:
            name: grafana-alerting
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: web
      port: 3000
      targetPort: web
---
# ── Traefik Ingress ────────────────────────────────────────────────────────────
# Exposes Grafana via Cloudflare Tunnel → Traefik → this Service.
# In CF Zero Trust → Tunnel → Public Hostnames, point grafana.yourdomain.com
# at HTTP http://traefik.kube-system.svc.cluster.local:80
# Replace yourdomain.com with your actual domain.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.silkepilon.dev  # <-- replace with your real hostname
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: web
