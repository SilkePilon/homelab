# ── portfolio Ingress ─────────────────────────────────────────────────────────
# Cloudflare Tunnel → Traefik → portfolio Service → Pod.
#
# In CF Zero Trust → Networks → Tunnels → homelab → Public Hostnames, add
# both of these (the apex has an empty Subdomain):
#   Subdomain: (none)  Domain: silkepilon.dev
#   Subdomain: www     Domain: silkepilon.dev
#   Service:   HTTP    http://traefik.kube-system.svc.cluster.local:80
#
# Both hostnames serve the site; Cloudflare handles TLS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  namespace: portfolio
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: silkepilon.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  name: http
    - host: www.silkepilon.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  name: http
