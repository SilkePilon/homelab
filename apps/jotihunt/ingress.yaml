# ── jotihunt Ingress ─────────────────────────────────────────────────────────
# Cloudflare Tunnel → Traefik → jotihunt Services.
#
# In CF Zero Trust → Networks → Tunnels → homelab → Public Hostnames, add:
#   Subdomain: jotihunt       Domain: silkepilon.dev
#   Subdomain: jotihunt-gps   Domain: silkepilon.dev
#   Service:   HTTP           http://traefik.kube-system.svc.cluster.local:80
# One subdomain level only: Universal SSL covers *.silkepilon.dev, not
# *.jotihunt.silkepilon.dev.
#
#   jotihunt.silkepilon.dev/       → client:80   (web app)
#   jotihunt.silkepilon.dev/api/…  → server:3000 (sees /…; prefix stripped)
#   jotihunt-gps.silkepilon.dev/   → traccar:5055 (OsmAnd GPS ingest only)
# The Traccar UI/API (8082) is never public: see ingress-tailnet.yaml.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
  namespace: jotihunt
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jotihunt-api
  namespace: jotihunt
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # <namespace>-<name>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: jotihunt-strip-api@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: jotihunt.silkepilon.dev
      http:
        paths:
          # Traefik ranks the longer /api rule ahead of / (jotihunt-web)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jotihunt-web
  namespace: jotihunt
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: jotihunt.silkepilon.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jotihunt-gps
  namespace: jotihunt
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: jotihunt-gps.silkepilon.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traccar
                port:
                  name: osmand
