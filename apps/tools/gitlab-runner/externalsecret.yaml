---
# gitlab-runner-secret, synced from Infisical (project homelab / prod / folder /gitlab-runner).
# runner-token (glrt-...) + empty runner-registration-token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-secret
  namespace: gitlab-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: gitlab-runner-secret
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /gitlab-runner
        name:
          regexp: ".*"
