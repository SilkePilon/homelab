apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/SilkePilon/homelab
    targetRevision: main
    # App-of-apps: this watches the folder of child Argo Applications below.
    # Add a new app by dropping another Application manifest in applications/.
    path: bootstrap/argocd/applications
    directory:
      recurse: true
      # Belt and braces: the template carries <PLACEHOLDER> names that are not
      # valid RFC 1123 subdomains, so it must never reach the API server.
      exclude: "_template.*"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Argo CD adds its own pre-delete finalizers to child Applications whose
  # charts carry pre-delete hooks (longhorn does). Those are never in git, so
  # without this the root app sits permanently OutOfSync on a field it wrote
  # itself.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
