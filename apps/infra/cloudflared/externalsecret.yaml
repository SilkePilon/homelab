---
# cloudflared-token, synced from Infisical (project homelab / prod / folder /cloudflared).
# Keys: token — tunnel token from the Cloudflare Zero Trust dashboard.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-token
  namespace: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: cloudflared-token
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /cloudflared
        name:
          regexp: ".*"
