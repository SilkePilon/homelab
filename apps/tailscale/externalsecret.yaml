---
# operator-oauth, synced from Infisical (project homelab / prod / folder /tailscale).
# client_id / client_secret of the operator's OAuth client (tag:k8s-operator).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: operator-oauth
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /tailscale
        name:
          regexp: ".*"
