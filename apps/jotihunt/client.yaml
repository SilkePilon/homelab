---
# ─────────────────────────────────────────────────────────────────────────────
# Jotihunt tracker web app — https://github.com/SilkePilon/jotihunt-tracker-client
# Image: ghcr.io/silkepilon/jotihunt-tracker-client (vite preview on :80;
#        dist/vite-envs.sh injects client.env at start; amd64 only)
# Public as https://jotihunt.silkepilon.dev/ (ingress.yaml).
# Stateless: RollingUpdate is fine.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: jotihunt
  labels:
    app.kubernetes.io/name: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: client
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: client
          image: ghcr.io/silkepilon/jotihunt-tracker-client:sha-a0eacc0@sha256:2727bf5149603553962532fd9d3478ca3429482cdcf93713fdaa497efc0b486b
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: jotihunt-client-env
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: jotihunt
  labels:
    app.kubernetes.io/name: client
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: client
  ports:
    - name: http
      port: 80
      targetPort: http
