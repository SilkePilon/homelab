# ── NUT (Network UPS Tools) Prometheus exporter — HON95 ───────────────────────
# Exposes the APC Back-UPS BX1600MI from the NUT server on the out-of-cluster
# tasks node (192.168.1.172:3493). NUT allows anonymous reads, so no creds here.
#
# This is HON95's exporter (multi-target model): it does NOT hold a fixed NUT
# server. Prometheus passes the NUT server as a ?target= query param on each
# scrape (see the `nut` job in prometheus.yaml). Metrics use the `nut_` prefix:
#   nut_battery_charge, nut_load, nut_status, nut_input_voltage_volts,
#   nut_battery_runtime_seconds, nut_battery_voltage_volts, nut_ups_info, ...
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nut-exporter
  namespace: monitoring
  labels:
    app: nut-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nut-exporter
  template:
    metadata:
      labels:
        app: nut-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: nut-exporter
          image: hon95/prometheus-nut-exporter:1
          env:
            # Defaults shown; metrics path stays /nut (matches the scrape job).
            - name: HTTP_PORT
              value: "9995"
            - name: RUST_LOG
              value: info
          ports:
            - containerPort: 9995
              name: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: nut-exporter
  namespace: monitoring
  labels:
    app: nut-exporter
spec:
  selector:
    app: nut-exporter
  ports:
    - name: metrics
      port: 9995
      targetPort: metrics
