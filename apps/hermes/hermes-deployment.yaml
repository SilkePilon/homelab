---
# ─────────────────────────────────────────────────────────────────────────────
# Hermes Agent Deployment
# Image: nousresearch/hermes-agent  (Docker Hub)
#
# The image uses s6-overlay (/init) as its process supervisor. A single
# container runs both the gateway and dashboard as s6-managed services.
# Do NOT override the entrypoint — /init handles everything.
#
# CMD = ["gateway", "run"] is passed through main-wrapper.sh as
# `hermes gateway run`, which runs the messaging gateway in the foreground
# (the correct mode for Docker / Kubernetes).
#
# The dashboard s6 service starts automatically when HERMES_DASHBOARD=1
# and requires basic-auth credentials via:
#   HERMES_DASHBOARD_BASIC_AUTH_USERNAME + HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
# (HERMES_DASHBOARD_INSECURE was removed in June 2026 — it no longer works)
#
# The image manages its own UID remapping via HERMES_UID/HERMES_GID.
# Do NOT set runAsNonRoot — the container starts as root and drops privileges
# itself via s6 cont-init scripts.
#
# ── PREREQUISITE SECRET ──────────────────────────────────────────────────────
# Create this before applying (see kustomization.yaml for the full command):
#
#   kubectl create secret generic hermes-secret -n hermes \
#     --from-literal=SIGNAL_ACCOUNT="+1234567890" \
#     --from-literal=SIGNAL_ALLOWED_USERS="+1234567890" \
#     --from-literal=HERMES_DASHBOARD_BASIC_AUTH_USERNAME="admin" \
#     --from-literal=HERMES_DASHBOARD_BASIC_AUTH_PASSWORD="changeme" \
#     --from-literal=OPENROUTER_API_KEY="sk-or-..."
#
# ── FIRST-RUN SETUP ──────────────────────────────────────────────────────────
# After the pod is running, run the Signal gateway setup wizard once:
#
#   kubectl exec -n hermes -it deployment/hermes -- hermes gateway setup
#
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      # No securityContext — image starts as root and remaps UID internally.
      initContainers:
        # Wait for signal-cli to be ready before starting the gateway.
        - name: wait-for-signal-cli
          image: alpine:3.24
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for signal-cli to be ready..."
              until wget -qO- http://signal-cli:8080/api/v1/check >/dev/null 2>&1; do
                echo "signal-cli not ready yet, retrying in 5s..."; sleep 5;
              done
              echo "signal-cli is ready."
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v2026.8.18
          imagePullPolicy: Always
          # args (not command!) — overrides Docker CMD while leaving the
          # ENTRYPOINT (/init + main-wrapper.sh) intact. main-wrapper.sh
          # sees "gateway run" → "gateway" is not in PATH → routes to
          # `hermes gateway run` (foreground daemon mode for containers).
          args: ["gateway", "run"]
          env:
            - name: HERMES_UID
              value: "1000"
            - name: HERMES_GID
              value: "1000"
            # Enable the s6-supervised dashboard service
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            # Dashboard basic-auth (required since June 2026 — insecure mode removed)
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
            # Signal integration
            - name: SIGNAL_HTTP_URL
              value: "http://signal-cli:8080"
            - name: SIGNAL_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: SIGNAL_ACCOUNT
            - name: SIGNAL_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: SIGNAL_ALLOWED_USERS
                  optional: true
            # LLM provider keys — add the one(s) you use to hermes-secret
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: OPENROUTER_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: OPENAI_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: GEMINI_API_KEY
                  optional: true
          ports:
            - name: dashboard
              containerPort: 9119
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: dashboard
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: dashboard
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 4

      volumes:
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-data
