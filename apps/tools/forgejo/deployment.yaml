# ─────────────────────────────────────────────────────────────────────────────
# Forgejo — self-hosted git forge with built-in CI (Forgejo Actions). One
# rootless container with SQLite; everything stateful is on forgejo-data.
#
# Configuration is the FORGEJO__<section>__<KEY> env vars below. On every
# start the image writes them into /var/lib/gitea/custom/conf/app.ini, so the
# env wins over anything edited in that file. Cheat sheet:
#   https://forgejo.org/docs/latest/admin/config-cheat-sheet/
#
# Theme: the GitHub theme, ghcr.io/silkepilon/forgejo-theme (built from
# images/forgejo-theme/), installed by the two `theme*` init containers.
#
# Upgrades: by hand (Renovate opens the PR but does not merge it), because the
# theme's page layouts are made for one exact Forgejo release. Bump the theme
# in images/forgejo-theme/Dockerfile to the release for the new Forgejo first;
# a mismatch is not fatal, the theme then runs as CSS only. Majors (every ~3
# months) run DB migrations and cannot be rolled back — read the release notes
# and snapshot the Longhorn volume first. The Forgejo tag appears three times
# below (theme, forgejo, setup); keep them equal.
#
# Secret: forgejo-secret (see externalsecret.yaml)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
spec:
  replicas: 1
  # RWO volume and SQLite: never two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
    spec:
      automountServiceAccountToken: false
      # A Service named `forgejo` would otherwise inject FORGEJO_* env vars.
      enableServiceLinks: false
      # The image is multi-arch and light, but the Pis share a power supply
      # and brown out under load. Keep the forge on the EliteDesks.
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsUser: 1000   # the rootless image's `git` user
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 60
      initContainers:
        # ── theme ────────────────────────────────────────────────────────────
        # 1. theme-files: the theme image is data only; copy it out.
        - name: theme-files
          image: ghcr.io/silkepilon/forgejo-theme:latest@sha256:206b5f15bc454607619f7d1393fb12445698212a367164fb7608507e4868f520
          imagePullPolicy: IfNotPresent
          command: ["cp", "-R", "/theme/.", "/staging/"]
          volumeMounts:
            - name: theme
              mountPath: /staging
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
        # 2. theme: install it into custom/ on the volume, which this setup
        #    owns: custom/templates and custom/public/assets are replaced on
        #    every start. The page layouts (templates/) only when they were
        #    made for this Forgejo release: a mismatched template can break
        #    pages or stop Forgejo from starting. The CSS works either way.
        #    Runs with the Forgejo image to ask the binary for its version.
        #    Copied, not mounted: on an empty volume a mount would make the
        #    kubelet create custom/ as root, and the image's setup script then
        #    fails to chmod it.
        - name: theme
          image: codeberg.org/forgejo/forgejo:17.0.2-rootless
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              c=/var/lib/gitea/custom
              want=$(cat /theme/FORGEJO_VERSION)
              have=$(forgejo --version | sed -E 's/^forgejo version ([^ +]+).*/\1/')
              rm -rf "$c/templates" "$c/public/assets"
              mkdir -p "$c/public"
              cp -R /theme/public/assets "$c/public/"
              if [ "$want" = "$have" ]; then
                cp -R /theme/templates "$c/"
                echo "theme: installed, with the GitHub layouts for Forgejo $have"
              else
                echo "theme: built for Forgejo $want but this is $have; CSS only, layouts skipped"
              fi
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
            - name: theme
              mountPath: /theme
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:17.0.2-rootless
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: TZ
              value: Europe/Amsterdam
            # ── server ──
            - name: FORGEJO__server__DOMAIN
              value: git.silkepilon.dev
            # Cloudflare terminates TLS; Traefik forwards plain HTTP.
            - name: FORGEJO__server__ROOT_URL
              value: https://git.silkepilon.dev/
            - name: FORGEJO__server__HTTP_PORT
              value: "3000"
            # Git is HTTPS only: no SSH server, no SSH clone URLs.
            - name: FORGEJO__server__DISABLE_SSH
              value: "true"
            - name: FORGEJO__server__START_SSH_SERVER
              value: "false"
            - name: FORGEJO__server__LFS_START_SERVER
              value: "true"
            # ── database ──
            - name: FORGEJO__database__DB_TYPE
              value: sqlite3
            - name: FORGEJO__database__SQLITE_JOURNAL_MODE
              value: WAL
            # ── security ──
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: forgejo-secret
                  key: SECRET_KEY
            # ── service ──
            # Public instance, one user: no sign-ups. Public repos stay
            # browsable without login.
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            - name: FORGEJO__service__SHOW_REGISTRATION_BUTTON
              value: "false"
            - name: FORGEJO__openid__ENABLE_OPENID_SIGNIN
              value: "false"
            - name: FORGEJO__openid__ENABLE_OPENID_SIGNUP
              value: "false"
            # ── actions ──
            # `uses: actions/checkout@v4` resolves against data.forgejo.org
            # (the default), which mirrors the common actions. Full URLs like
            # `uses: https://github.com/owner/action@v1` work too.
            - name: FORGEJO__actions__ENABLED
              value: "true"
            # ── ui ──
            # The theme-github-*.css files from the `theme` init container.
            # THEMES is what Settings → Appearance offers; Forgejo does not
            # find custom themes by itself. Forgejo's built-ins are left out:
            # the GitHub layouts are only styled by the github-* themes.
            - name: FORGEJO__ui__THEMES
              value: >-
                github-auto, github-light, github-dark, github-soft-dark,
                github-high-contrast-auto, github-high-contrast-light, github-high-contrast-dark, github-high-contrast-soft-dark,
                github-colorblind-auto, github-colorblind-light, github-colorblind-dark,
                github-high-contrast-colorblind-auto, github-high-contrast-colorblind-light, github-high-contrast-colorblind-dark,
                github-tritanopia-auto, github-tritanopia-light, github-tritanopia-dark,
                github-high-contrast-tritanopia-auto, github-high-contrast-tritanopia-light, github-high-contrast-tritanopia-dark,
                github-pink-auto, github-pink-light, github-pink-dark, github-pink-soft-dark,
                github-catppuccin-auto, github-catppuccin-latte, github-catppuccin-frappe, github-catppuccin-macchiato, github-catppuccin-mocha,
                github-gitea-auto, github-gitea-light, github-gitea-dark
            - name: FORGEJO__ui__DEFAULT_THEME
              value: github-dark
            # ── misc ──
            - name: FORGEJO__time__DEFAULT_UI_LOCATION
              value: Europe/Amsterdam
            # Renovate handles upgrades.
            - name: FORGEJO__cron.update_checker__ENABLED
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
            - name: tmp
              mountPath: /tmp/gitea
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          # First start runs every DB migration (a few seconds on SQLite).
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

        # ── setup ────────────────────────────────────────────────────────────
        # Makes the instance usable without clicking anything, then idles:
        #   1. creates the admin user if it does not exist yet
        #      (ADMIN_PASSWORD is only read then; change it in the UI later),
        #   2. registers the forgejo-runner with RUNNER_SECRET. Idempotent:
        #      the first 16 hex chars identify the runner, the rest is its
        #      token, so re-running only refreshes the token.
        # Both use the forgejo CLI against the same volume, which is why this
        # lives in the pod and not in a Job.
        - name: setup
          image: codeberg.org/forgejo/forgejo:17.0.2-rootless
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              until wget -q -O /dev/null http://127.0.0.1:3000/api/healthz; do
                echo "waiting for forgejo..."; sleep 5
              done
              if forgejo admin user list --admin | awk 'NR > 1 { print $2 }' | grep -qxF "$ADMIN_USERNAME"; then
                echo "admin user $ADMIN_USERNAME exists"
              else
                forgejo admin user create --admin --username "$ADMIN_USERNAME" \
                  --email "$ADMIN_EMAIL" --password "$ADMIN_PASSWORD" --must-change-password=false
              fi
              forgejo forgejo-cli actions register --name k8s-amd64 --secret "$RUNNER_SECRET"
              echo "setup done"
              trap 'exit 0' TERM INT
              while :; do sleep 3600 & wait $!; done
          env:
            - name: ADMIN_USERNAME
              value: silkepilon
            # Required by Forgejo; there is no mailer. Change it in the UI.
            - name: ADMIN_EMAIL
              value: silkepilon@noreply.git.silkepilon.dev
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-secret
                  key: ADMIN_PASSWORD
            - name: RUNNER_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-secret
                  key: RUNNER_SECRET
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
            - name: tmp
              mountPath: /tmp/gitea
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
        - name: tmp
          emptyDir: {}
        - name: theme
          emptyDir: {}
