# ── Traefik Ingress ──────────────────────────────────────────────────────────
# Exposes InvoiceNinja via Cloudflare Tunnel → Traefik → this Service.
#
# In CF Zero Trust → Tunnel → Public Hostnames, add:
#   Subdomain: invoice   Domain: aethero.studio
#   Service:   HTTP      http://traefik.kube-system.svc.cluster.local:80
#
# APP_URL in deployment.yaml must equal the public hostname (https://invoice.aethero.studio).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: invoiceninja
  namespace: invoiceninja
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: invoice.aethero.studio
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: invoiceninja
                port:
                  name: http
