---
# pihole-secret, synced from Infisical (project homelab / prod / folder /pihole).
# Keys: WEBPASSWORD — Pi-hole admin UI password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pihole-secret
  namespace: pihole
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: pihole-secret
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /pihole
        name:
          regexp: ".*"
