apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Plain Kustomize base — consumed identically by Argo CD and Flux CD.
namespace: gitlab

# ─────────────────────────────────────────────────────────────────────────────
# gitlab — GitLab Community Edition at https://gitlab.silkepilon.dev.
# Git over HTTPS only. The CI runner is a separate Helm app:
# bootstrap/argocd/applications/gitlab-runner.yaml.
#
# BEFORE applying this stack:
#
#  1. Create the namespace and the secret (NOT committed to git). The password
#     is read on first boot only:
#       kubectl create namespace gitlab
#       kubectl -n gitlab create secret generic gitlab-secret \
#         --from-literal=GITLAB_ROOT_PASSWORD="$(openssl rand -base64 24)"
#
#  2. Add a Cloudflare Tunnel public hostname entry:
#       Subdomain: gitlab   Domain: silkepilon.dev
#       Service:   HTTP     http://traefik.kube-system.svc.cluster.local:80
#
#  3. Let Argo CD sync, then follow apps/gitlab/README.md for first login,
#     hardening and runner registration.
# ─────────────────────────────────────────────────────────────────────────────

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
    includeSelectors: false

# Keep only 2 old ReplicaSets/ControllerRevisions per workload instead of the
# Kubernetes default of 10. Without this the cluster accumulates dozens of
# empty ReplicaSets, and each retained revision pins its container image on the
# node — costly on the Pis, which have 28-58Gi disks.
patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/revisionHistoryLimit
        value: 2
