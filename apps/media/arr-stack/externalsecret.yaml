---
# smb-creds, synced from Infisical (project homelab / prod / folder /arr-stack/smb-creds).
# NAS username/password for the SMB media volume.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smb-creds
  namespace: arr-stack
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: smb-creds
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /arr-stack/smb-creds
        name:
          regexp: ".*"
