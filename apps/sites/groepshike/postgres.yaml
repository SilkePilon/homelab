---
# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL 18 — groepshike's database (Payload CMS).
# Service DNS: groepshike-db (inside the namespace), used by DATABASE_URL in
# groepshike-secret.
#
# Major upgrades: a new major can't open the old data dir. Dump, start the new
# major on a fresh PVC, restore, then switch claimName (17 -> 18 was done this
# way on 2026-11-17; groepshike-postgres-data still holds the 17 data for
# rollback).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: groepshike-db
  namespace: groepshike
  labels:
    app.kubernetes.io/name: groepshike-db
spec:
  replicas: 1
  # ReadWriteOnce PVC — only one writer at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: groepshike-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: groepshike-db
    spec:
      # The postgres image starts as root and drops to the postgres user itself
      # (it chowns PGDATA), so no custom securityContext.
      containers:
        - name: postgres
          image: postgres:19.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: groepshike
            - name: POSTGRES_DB
              value: groepshike
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: groepshike-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            # 18+ image: PGDATA is /var/lib/postgresql/18/docker, so mount the
            # parent. The versioned subdir keeps lost+found out of the way.
            - name: data
              mountPath: /var/lib/postgresql
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "groepshike", "-d", "groepshike"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "groepshike", "-d", "groepshike"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: groepshike-postgres18-data
---
apiVersion: v1
kind: Service
metadata:
  name: groepshike-db
  namespace: groepshike
  labels:
    app.kubernetes.io/name: groepshike-db
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: groepshike-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
