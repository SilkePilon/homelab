apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Plain Kustomize base — consumed identically by Argo CD and Flux CD.
namespace: werkplekinspectie

# ─────────────────────────────────────────────────────────────────────────────
# werkplekinspectie — werkplekinspectie.app (PWA for field technicians: fill
# in and sign the workplace inspection, mailed as a PDF; nothing is stored).
#
# BEFORE applying this stack:
#
#  1. Add the keys in Infisical, folder /werkplekinspectie (see the header of
#     deployment.yaml).
#
#  2. Add the Cloudflare Tunnel public hostname (see ingress.yaml):
#       werkplekinspectie.app → HTTP http://traefik.kube-system.svc.cluster.local:80
#
#  3. Push to main; Argo CD syncs it. Send one test inspection from a phone.
# ─────────────────────────────────────────────────────────────────────────────

resources:
  - namespace.yaml
  - service.yaml
  - deployment.yaml
  - ingress.yaml
  - externalsecret.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
    includeSelectors: false

# Keep only 2 old ReplicaSets/ControllerRevisions per workload instead of the
# Kubernetes default of 10. Without this the cluster accumulates dozens of
# empty ReplicaSets, and each retained revision pins its container image on the
# node — costly on the Pis, which have 28-58Gi disks.
patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/revisionHistoryLimit
        value: 2
  - target:
      kind: DaemonSet
    patch: |
      - op: add
        path: /spec/revisionHistoryLimit
        value: 2
