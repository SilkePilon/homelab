---
# ─────────────────────────────────────────────────────────────────────────────
# InvoiceNinja v5 Deployment
#
# Image: invoiceninja/invoiceninja-debian (PHP-FPM on port 9000)
#   The debian image runs PHP-FPM only — an nginx sidecar serves HTTP on 80
#   and proxies PHP requests to FPM on 127.0.0.1:9000.
#
# An initContainer seeds the shared `app-public` emptyDir from the image so
# nginx has access to the document root (public/).
#
# First-run account seeding:
#   IN_USER_EMAIL / IN_PASSWORD are read on first startup to auto-create the
#   admin account. After the pod has started once these env vars are safe to
#   remove (the account is stored in the DB).
#
# BEFORE applying:
#   1. kubectl create namespace invoiceninja
#   2. Create the secret (NOT committed to git):
#        kubectl create secret generic invoiceninja-secret \
#          --from-literal=APP_KEY="base64:$(openssl rand -base64 32)" \
#          --from-literal=DB_PASSWORD="$(openssl rand -hex 16)" \
#          --from-literal=MARIADB_ROOT_PASSWORD="$(openssl rand -hex 16)" \
#          --from-literal=IN_USER_EMAIL="devsilkepilon@gmail.com" \
#          --from-literal=IN_PASSWORD="<your-password>" \
#          -n invoiceninja
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoiceninja
  namespace: invoiceninja
  labels:
    app.kubernetes.io/name: invoiceninja
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: invoiceninja
  template:
    metadata:
      labels:
        app.kubernetes.io/name: invoiceninja
    spec:
      securityContext:
        fsGroup: 33  # www-data
      initContainers:
        # Copy the public/ directory from the image into a shared emptyDir so
        # the nginx sidecar can serve static assets from the correct root.
        - name: init-public
          image: invoiceninja/invoiceninja-debian:5
          command: ["/bin/sh", "-c", "cp -r /var/www/app/public/. /init-public/"]
          volumeMounts:
            - name: app-public
              mountPath: /init-public
      containers:
        # ── PHP-FPM app (port 9000) ───────────────────────────────────────────
        - name: app
          image: invoiceninja/invoiceninja-debian:5
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              value: "https://invoice.aethero.studio"
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: invoiceninja-secret
                  key: APP_KEY
            - name: DB_HOST
              value: invoiceninja-mariadb
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: invoiceninja
            - name: DB_USERNAME
              value: invoiceninja
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: invoiceninja-secret
                  key: DB_PASSWORD
            - name: REQUIRE_HTTPS
              value: "false"
            - name: TRUSTED_PROXIES
              value: "*"
            - name: LOG_CHANNEL
              value: stderr
            - name: QUEUE_CONNECTION
              value: sync
            - name: IN_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: invoiceninja-secret
                  key: IN_USER_EMAIL
            - name: IN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: invoiceninja-secret
                  key: IN_PASSWORD
          volumeMounts:
            - name: invoiceninja-storage
              mountPath: /var/www/app/storage
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi

        # ── Nginx sidecar (port 80) ─────────────────────────────────────────────
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: app-public
              mountPath: /var/www/app/public
            - name: invoiceninja-storage
              mountPath: /var/www/app/storage
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 8

      volumes:
        - name: app-public
          emptyDir: {}
        - name: invoiceninja-storage
          persistentVolumeClaim:
            claimName: invoiceninja-storage
        - name: nginx-config
          configMap:
            name: invoiceninja-nginx-config
