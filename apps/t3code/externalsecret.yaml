---
# claude-oauth, synced from Infisical (project homelab / prod / folder /t3code).
# CLAUDE_CODE_OAUTH_TOKEN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-oauth
  namespace: t3code
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: claude-oauth
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /t3code
        name:
          regexp: ".*"
