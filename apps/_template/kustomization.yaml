apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Plain Kustomize base — consumed identically by Argo CD and Flux CD.
namespace: <APP_NAME>

# ─────────────────────────────────────────────────────────────────────────────
# <APP_NAME> — one-line description of what this app does.
#
# To use this template:
#
#  1. cp -r apps/_template apps/<group>/<APP_NAME>. The folder name becomes
#     the Argo CD app and the namespace, so it must match <APP_NAME>.
#
#  2. Replace every <PLACEHOLDER> in this folder.
#
#  3. Secrets: add the keys to Infisical (homelab / prod, folder /<APP_NAME>)
#     and keep externalsecret.yaml. Drop it if the app has no secrets.
#
#  4. Public app: add a Cloudflare Tunnel public hostname pointing at
#       http://traefik.kube-system.svc.cluster.local:80
#
#  5. Push to main. The ApplicationSet creates and syncs the app.
# ─────────────────────────────────────────────────────────────────────────────

resources:
  - namespace.yaml
  - pvc.yaml        # remove if the app is stateless
  - deployment.yaml
  - service.yaml
  - ingress.yaml    # remove if the app should not be exposed externally
  - externalsecret.yaml  # remove if the app has no secrets

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
    includeSelectors: false

# Keep only 2 old ReplicaSets/ControllerRevisions per workload instead of the
# Kubernetes default of 10. Without this the cluster accumulates dozens of
# empty ReplicaSets, and each retained revision pins its container image on the
# node — costly on the Pis, which have 28-58Gi disks.
patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/revisionHistoryLimit
        value: 2
  - target:
      kind: DaemonSet
    patch: |
      - op: add
        path: /spec/revisionHistoryLimit
        value: 2
