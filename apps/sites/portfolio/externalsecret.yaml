---
# portfolio-secret, synced from Infisical (project homelab / prod / folder /portfolio).
# Keys: PAYLOAD_SECRET — Payload admin session signing key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portfolio-secret
  namespace: portfolio
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: portfolio-secret
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /portfolio
        name:
          regexp: ".*"
