apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: alloy
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      # Tolerate all taints so alloy runs on every node (including control-plane)
      tolerations:
        - operator: Exists
      containers:
        - name: alloy
          image: grafana/alloy:v1.18.0
          args:
            - run
            - /etc/alloy/config.alloy
            # Positions/WAL live on a hostPath so they survive pod restarts.
            # NOT under /var/lib/alloy — the image ships that dir as 0770 473:473,
            # and with capabilities dropped, root has no CAP_DAC_OVERRIDE to enter it.
            - --storage.path=/var/lib/alloy-data
            - --server.http.listen-addr=0.0.0.0:12345
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 12345
              name: http
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy-data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: pods-logs
          hostPath:
            path: /var/log/pods
        - name: data
          hostPath:
            path: /var/lib/alloy-data
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
