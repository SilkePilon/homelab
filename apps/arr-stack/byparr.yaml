# ── Byparr + ext-to-torznab + Gluetun VPN sidecar ────────────────────────────
# Byparr API: port 8191 (internal only) — FlareSolverr-compatible /v1
# ext-to-torznab Torznab API: port 5000 (Service in ext-to-torznab.yaml)
#
# Byparr (https://github.com/ThePhaseless/Byparr) replaced FlareSolverr here.
# It speaks the same POST /v1 request shape but works differently:
#   - every request launches a fresh camoufox Firefox, solves the challenge,
#     returns cookies + HTML and closes the browser again — there are no
#     browser sessions to create, leak or reap;
#   - only request.get exists; ext-to-torznab (FLARESOLVERR_BACKEND=byparr)
#     refreshes cookies with a page solve and POSTs directly instead;
#   - failures come back as HTTP 408/502 rather than status: "error".
#
# Gluetun runs as a sidecar so ALL traffic from this pod — Byparr's Firefox
# AND ext-to-torznab's plain HTTP — exits through ProtonVPN natively
# (shared network namespace — no HTTP_PROXY needed).
#
# Why ext-to-torznab lives in this pod: Cloudflare binds the cf_clearance
# cookie that the solver earns to the IP that solved the challenge. When the
# proxy ran in its own pod (egressing from the node, not the VPN) the imported
# cookie was useless, every plain request was challenged again, and every
# search and magnet lookup went through a browser — 143 solver fallbacks and
# 27 browser sessions in one log window. Sharing the network namespace makes
# the solved cookie valid for the proxy's own fast path, so Byparr is only
# used for the occasional re-solve. With Byparr this matters even more: it
# cannot POST through the browser, so magnet lookups depend on the direct
# transport accepting the solved cookie.
#
# IP rotation: the gluetun-rotate CronJob (in gluetun-proxy.yaml) restarts
# this deployment every 6 hours, causing Gluetun to pick a new random
# ProtonVPN server — giving a fresh egress IP. Solved cookies die with the old
# IP; the first challenged request afterwards pays one Byparr solve. Do not
# rotate the VPN mid-session any other way for the same reason.
#
# ext-to-torznab reaches Byparr over loopback (http://127.0.0.1:8191).
# Inbound cluster traffic is unaffected by the VPN — the Services target the
# pod IP and gluetun's firewall accepts the listed FIREWALL_INPUT_PORTS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: byparr
  namespace: arr-stack
  labels:
    app.kubernetes.io/name: byparr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: byparr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: byparr
    spec:
      # Route DNS through gluetun's built-in resolver (127.0.0.1:53).
      # CoreDNS (10.43.0.10) is blocked by gluetun's firewall once the VPN
      # tunnel is up. Use IPv4 loopback — BLOCK_IPV6=on causes EAGAIN on
      # UDP to [::1]:53. ndots=1: external hostnames go straight to an FQDN
      # lookup instead of walking the cluster search domains, which gluetun
      # cannot resolve anyway.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
        options:
          - name: ndots
            value: "1"
      # Byparr publishes amd64 and arm64 images, but upstream describes ARM
      # support as minimal and untested beyond one VM. Keep the browser stack
      # on the x86 nodes; the Pis stay for the light workloads.
      nodeSelector:
        kubernetes.io/arch: amd64
      initContainers:
        # Ensure /dev/net/tun exists before gluetun starts
        - name: init-tun
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - |
              mkdir -p /dev/net
              [ -c /dev/net/tun ] || mknod /dev/net/tun c 10 200
              chmod 0666 /dev/net/tun
          securityContext:
            privileged: true
        # Refresh the Proton server list before gluetun starts. The list
        # compiled into gluetun v3.41.3 dates from 2025-11-18 and cannot be
        # refreshed in-release: Proton login-walled its API (and answers the
        # login with a CAPTCHA, gluetun #3022), and the credential-free
        # UPDATER_PREFER_DIRECT_DOWNLOAD only exists on master (2026-05-19).
        # Measured: 71 of the 800 IPs in the built-in list are gone from the
        # current one, which is what the "startup check: all check tries
        # failed" loops (28 of 29 servers rejected) were made of.
        #
        # gluetun reads /gluetun/servers.json at start and prefers a provider
        # entry whose timestamp is newer than the built-in one (same schema
        # version 4 on both sides, verified). The maintainer publishes fresh
        # data at gluetun-servers; this fetches it and wraps it in the
        # persisted-file shape. --doh-url because the pod's resolver is
        # gluetun itself, which is not running yet. On any failure the file
        # from the previous boot stays (PVC) and gluetun falls back to the
        # built-in list.
        - name: init-servers
          image: curlimages/curl:8.22.0
          command:
            - sh
            - -c
            - |
              set -u
              url=https://raw.githubusercontent.com/qdm12/gluetun-servers/main/pkg/servers/protonvpn.json
              if curl -fsSL --retry 3 --retry-delay 5 --max-time 90 \
                   --doh-url https://1.1.1.1/dns-query "$url" -o /gluetun/protonvpn.json.tmp \
                 && [ -s /gluetun/protonvpn.json.tmp ]; then
                { printf '{"version":1,"protonvpn":'; cat /gluetun/protonvpn.json.tmp; printf '}'; } \
                  > /gluetun/servers.json.tmp \
                  && mv /gluetun/servers.json.tmp /gluetun/servers.json \
                  && echo "servers.json refreshed from gluetun-servers"
              else
                echo "download failed; keeping existing servers.json (if any)" >&2
              fi
              rm -f /gluetun/protonvpn.json.tmp
          volumeMounts:
            - name: gluetun-state
              mountPath: /gluetun
      containers:
        # ── gluetun: ProtonVPN WireGuard tunnel ──────────────────────────────
        # Settings mirror the qbittorrent sidecar (the known-good reference in
        # this namespace), minus port forwarding — Byparr never listens on the
        # VPN side, so PORT_FORWARD_ONLY is deliberately not set. That keeps
        # the whole ProtonVPN WireGuard pool eligible, which is what makes the
        # 6-hourly rotation actually produce different exit IPs.
        - name: gluetun
          image: ghcr.io/qdm12/gluetun:v3.41.3
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          lifecycle:
            postStart:
              exec:
                # Clean up stale IP rules from previous pod exits (Kubernetes
                # shares IP rules across the pod namespace). Fix from gluetun wiki:
                # https://github.com/qdm12/gluetun-wiki/blob/main/setup/advanced/kubernetes.md
                command: ["/bin/sh", "-c", "(ip rule del table 51820; ip -6 rule del table 51820) || true"]
          env:
            # Native ProtonVPN provider rather than a hardcoded endpoint. A
            # Proton WireGuard private key is valid on every Proton server, so
            # gluetun picks the server, its public key and endpoint from its
            # own server list — a fresh random pick on every container start.
            - name: VPN_SERVICE_PROVIDER
              value: protonvpn
            - name: VPN_TYPE
              value: wireguard
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: protonvpn-wg
                  key: privateKey
            - name: WIREGUARD_ADDRESSES
              value: "10.2.0.2/32"
            # Restrict to privacy-friendly jurisdictions. Wider than
            # qbittorrent's single country on purpose: more servers in the
            # pool means the rotation is less likely to land on the same IP.
            - name: SERVER_COUNTRIES
              value: "Netherlands,Switzerland,Sweden,Iceland"
            - name: WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL
              value: "25s"
            # Lower MTU fixes TCP MSS clamping issues (ICMP works but TCP times out)
            - name: WIREGUARD_MTU
              value: "1280"
            - name: WIREGUARD_ALLOWED_IPS
              value: "0.0.0.0/0"
            # Byparr only makes outbound requests — no forwarded port needed.
            - name: VPN_PORT_FORWARDING
              value: "off"
            # Ports other pods (and kubelet probes) must reach on the pod IP:
            # Byparr API and the ext-to-torznab Torznab API.
            - name: FIREWALL_INPUT_PORTS
              value: "8191,5000"
            - name: TZ
              value: "Etc/UTC"
            # Disable IPv6 — fixes "adding IPv6 rule: file exists" on Kubernetes
            - name: BLOCK_IPV6
              value: "on"
            # Plain UDP DNS to public resolvers through the tunnel. DoT is out
            # (ProtonVPN blocks TCP:853 at exit nodes) and DoH was measured
            # failing constantly from this sidecar and qbittorrent's: 65 and
            # 131 "context deadline exceeded / connection reset" warnings per
            # 30 min, each a 2 s stall. Firefox in Byparr does dozens of
            # lookups per solve and the proxy's magnet POSTs failed in bursts
            # on name resolution. Plain UDP to 1.1.1.1 answered 3/3 in
            # ~125 ms from the same pod. Queries stay inside WireGuard up to
            # the exit, which already sees every destination anyway.
            - name: DNS_UPSTREAM_RESOLVER_TYPE
              value: "plain"
            - name: DNS_UPSTREAM_PLAIN_ADDRESSES
              value: "1.1.1.1:53,1.0.0.1:53"
            # Use IPs directly — the healthcheck resolves via /etc/resolv.conf,
            # which points at gluetun itself and is unavailable until the tunnel
            # is up, so a hostname target would deadlock startup.
            - name: HEALTH_TARGET_ADDRESSES
              value: "1.1.1.1:443,8.8.8.8:443"
            # Disable unused proxy features
            - name: HTTPPROXY
              value: "off"
            - name: SHADOWSOCKS
              value: "off"
            # Disable DNS block lists — they consume ~200MB RAM on download/parse
            - name: BLOCK_MALICIOUS
              value: "off"
            - name: BLOCK_SURVEILLANCE
              value: "off"
            - name: BLOCK_ADS
              value: "off"
            # Suppress cosmetic error: GitHub API format changed and gluetun
            # cannot unmarshal the version check response (no functional impact).
            - name: VERSION_INFORMATION
              value: "off"
            # Server list freshness is handled by the init-servers initContainer
            # (see initContainers). UPDATER_PREFER_DIRECT_DOWNLOAD replaces it
            # once a gluetun release ships it (on master since 2026-05-19).
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: gluetun-state
              mountPath: /gluetun
        # ── Byparr ───────────────────────────────────────────────────────────
        - name: byparr
          # Upstream tags carry no "v" prefix (3.0.4, not v3.0.4).
          image: ghcr.io/thephaseless/byparr:3.0.4
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: TZ
              value: "Etc/UTC"
            # No PROXY_SERVER — all traffic from this container exits through
            # the gluetun sidecar's WireGuard tunnel natively (shared pod
            # network namespace). BROWSER_LOCALE stays unset so Byparr derives
            # it from the VPN egress country, matching the exit IP.
          ports:
            - name: api
              containerPort: 8191
          # The image runs as uid 1000 with /cache and /home/byparr made
          # world-writable at build time; no volumes needed beyond /dev/shm.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          # Firefox needs a real shared-memory segment; the default 64Mi
          # /dev/shm makes camoufox fail with FileNotFoundError from
          # multiprocessing (upstream README: shm_size 512mb). An emptyDir
          # backed by memory counts towards the container's memory limit.
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          # One throw-away Firefox per solve (~400-700 MiB while it runs).
          # ext-to-torznab serialises solver calls, but the liveness /health
          # fetch can overlap with a real solve, so budget for two browsers
          # plus the 512Mi /dev/shm cap.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          # /health is not a cheap ping: Byparr launches a browser and loads
          # https://google.com through the VPN, so it doubles as a tunnel +
          # DNS check. Give it a long timeout and call it rarely.
          #
          # A cold Proton handshake plus the first Firefox launch can exceed
          # two minutes. The startupProbe holds the liveness probe off for up
          # to 10 minutes so a slow tunnel does not restart-loop the pod.
          startupProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 15
            timeoutSeconds: 60
            failureThreshold: 40
          # Readiness only needs the API to accept connections; a browser
          # launch every 15 s would burn CPU for nothing.
          readinessProbe:
            tcpSocket:
              port: api
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 600
            timeoutSeconds: 60
            failureThreshold: 3
        # ── ext-to-torznab: Torznab API proxy for ext.to ─────────────────────
        # Plain HTTP first (through the VPN, same IP as Firefox), Byparr over
        # loopback only when Cloudflare challenges. See ext-to-torznab.yaml
        # for the Service and the indexer setup notes.
        - name: ext-to-torznab
          # 1.3.x knows the Byparr backend (no sessions.create, no
          # request.post); older images send sessions.create first, which
          # Byparr answers with HTTP 502. 1.3.1 keeps the solver's cookie
          # domains, without which the solved cf_clearance never reached the
          # direct transport.
          image: ghcr.io/silkepilon/ext-to-torznab:1.3.2
          imagePullPolicy: IfNotPresent
          env:
            - name: FLARESOLVERR_URL
              value: "http://127.0.0.1:8191"
            # Skip the auto-probe; the neighbour is always Byparr.
            - name: FLARESOLVERR_BACKEND
              value: "byparr"
            # No EXT_TO_URL: the built-in mirror list (extto.com, ext.to,
            # ext2.to) is used as-is. search.extto.com used to be listed first
            # but it 301s to extto.com — Cloudflare scopes cf_clearance to the
            # host that issued it, and requests turns a redirected POST into a
            # GET, so magnet lookups through that hostname can never succeed.
            # extto.com is challenged now as well, so the alias buys nothing.
            - name: API_KEY
              value: ""
            - name: PORT
              value: "5000"
            - name: HOST
              value: "0.0.0.0"
            # A lone Turnstile solve through the ProtonVPN egress measured 27 s
            # (ext.to) to 57 s (extto.com) on FlareSolverr; Byparr adds a
            # browser launch on top. 60 s left no margin, so keep 120 s.
            - name: FLARESOLVERR_TIMEOUT
              value: "120000"
            # FLARESOLVERR_SESSION_IDLE / _TTL / _TABS_TILL_VERIFY are
            # FlareSolverr-only knobs; Byparr has no sessions to expire.
            # Answer a search after at most 5 s of magnet resolution; the rest
            # resolve in the background or on grab.
            - name: MAGNET_TIME_BUDGET
              value: "5"
            - name: INCLUDE_ADULT
              value: "true"
            - name: LOG_LEVEL
              value: "INFO"
          ports:
            - name: torznab
              containerPort: 5000
          # Measured ~45 MiB idle, ~120 MiB under 8 concurrent searches with
          # the image's MALLOC_ARENA_MAX=2 (was ~270 MiB and OOM-looping
          # without it).
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 256Mi
          # Startup waits for gluetun's tunnel, same as Byparr above.
          startupProbe:
            httpGet:
              path: /healthz
              port: torznab
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: torznab
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: torznab
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: gluetun-state
          persistentVolumeClaim:
            claimName: gluetun-byparr
---
# Byparr API — used by ext-to-torznab over loopback; the Service exists for
# port-forward debugging (http://localhost:8191/docs) and for any other
# in-cluster consumer that wants a FlareSolverr-compatible endpoint.
apiVersion: v1
kind: Service
metadata:
  name: byparr
  namespace: arr-stack
  labels:
    app.kubernetes.io/name: byparr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: byparr
  ports:
    - name: api
      port: 8191
      targetPort: api
