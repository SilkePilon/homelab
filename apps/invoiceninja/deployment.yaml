---
# ─────────────────────────────────────────────────────────────────────────────
# InvoiceNinja v5 Deployment
#
# Architecture: two containers in one pod.
#   app   — invoiceninja/invoiceninja (PHP-FPM on port 9000)
#   nginx — nginx:alpine (serves static assets, proxies PHP to FPM)
#
# An initContainer seeds the shared `app-public` emptyDir from the image so
# nginx has access to the document root (public/).
#
# BEFORE applying:
#   1. kubectl create namespace invoiceninja
#   2. Create the secret (NOT committed to git):
#        kubectl create secret generic invoiceninja-secret \
#          --from-literal=APP_KEY="base64:$(openssl rand -base64 32)" \
#          --from-literal=DB_PASSWORD="$(openssl rand -hex 16)" \
#          --from-literal=MARIADB_ROOT_PASSWORD="$(openssl rand -hex 16)" \
#          -n invoiceninja
#
# APP_KEY is the Laravel encryption key — back it up; changing it breaks
# all encrypted data (client data, tokens, etc.).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoiceninja
  namespace: invoiceninja
  labels:
    app.kubernetes.io/name: invoiceninja
spec:
  replicas: 1
  # ReadWriteOnce PVC — only one writer at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: invoiceninja
  template:
    metadata:
      labels:
        app.kubernetes.io/name: invoiceninja
    spec:
      securityContext:
        fsGroup: 33  # www-data — ensures PVC is writable by the app
      initContainers:
        # Copy the public/ directory from the image into a shared emptyDir so
        # the nginx container can use it as the document root.
        - name: init-public
          image: invoiceninja/invoiceninja:5
          command: ["/bin/sh", "-c", "cp -r /var/www/app/public/. /init-public/"]
          volumeMounts:
            - name: app-public
              mountPath: /init-public
      containers:
        # ── PHP-FPM app ──────────────────────────────────────────────────────
        - name: app
          image: invoiceninja/invoiceninja:5
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            # Must match the public hostname used by Cloudflare Tunnel.
            - name: APP_URL
              value: "https://invoice.aethero.studio"
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: invoiceninja-secret
                  key: APP_KEY
            - name: DB_HOST
              value: invoiceninja-mariadb
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: invoiceninja
            - name: DB_USERNAME
              value: invoiceninja
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: invoiceninja-secret
                  key: DB_PASSWORD
            # CF Tunnel terminates TLS; internal traffic is plain HTTP.
            - name: REQUIRE_HTTPS
              value: "false"
            # Trust all upstream proxies (Traefik + CF Tunnel).
            - name: TRUSTED_PROXIES
              value: "*"
            - name: LOG_CHANNEL
              value: stderr
            # sync: no separate queue worker needed for a homelab.
            - name: QUEUE_CONNECTION
              value: sync
            - name: PDF_GENERATOR
              value: snappdf
          volumeMounts:
            - name: invoiceninja-storage
              mountPath: /var/www/app/storage
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi

        # ── Nginx reverse-proxy / static file server ─────────────────────────
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            # Document root from initContainer.
            - name: app-public
              mountPath: /var/www/app/public
            # Storage PVC mounted read-only so nginx can serve uploaded files
            # under /var/www/app/storage (matches the public/storage symlink).
            - name: invoiceninja-storage
              mountPath: /var/www/app/storage
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6

      volumes:
        - name: app-public
          emptyDir: {}
        - name: invoiceninja-storage
          persistentVolumeClaim:
            claimName: invoiceninja-storage
        - name: nginx-config
          configMap:
            name: invoiceninja-nginx-config
