# ── Traefik Ingress ──────────────────────────────────────────────────────────
# Exposes Oxynote via Cloudflare Tunnel → Traefik → oxynote Service.
#
# In CF Zero Trust → Tunnel → Public Hostnames, add:
#   Subdomain: wiki   Domain: silkepilon.dev
#   Service:   HTTP  http://traefik.kube-system.svc.cluster.local:80
#
# Cloudflare terminates TLS; Traefik only ever sees cleartext on `web`.
# OXYNOTE_PUBLIC_URL in the Deployment must match this host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oxynote
  namespace: oxynote
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: wiki.silkepilon.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oxynote
                port:
                  name: http
