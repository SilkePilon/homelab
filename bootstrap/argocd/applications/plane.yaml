apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plane
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # ───────────────────────────────────────────────────────────────────────────
  # Plane (Community Edition) — project management. https://plane.so
  #
  # Helm-sourced, like tailscale and longhorn: upstream ships a chart that
  # renders nine workloads plus Traefik IngressRoute CRs, so rendering it to
  # static manifests would mean re-rendering on every bump.
  #
  # Multi-source: the chart plus apps/plane, which holds the ExternalSecret
  # for `plane-secret`.
  #
  # BEFORE this app can sync, see apps/plane/README.md. In short: fill the
  # Infisical folder /plane (NOT committed to git), then add
  # plane.silkepilon.dev to the Cloudflare Tunnel public hostnames.
  # ───────────────────────────────────────────────────────────────────────────
  sources:
    - repoURL: https://helm.plane.so/
      chart: plane-ce
      targetRevision: 1.8.0
      helm:
        releaseName: plane
        values: |
          planeVersion: v1.4.1

          ingress:
            enabled: true
            appHost: plane.silkepilon.dev
            # "traefik" makes the chart emit IngressRoute/Middleware CRs instead
            # of a plain Ingress. k3s ships those CRDs.
            ingressClass: traefik
            traefik:
              maxRequestBodyBytes: 20971520

          ssl:
            # Cloudflare terminates TLS and forwards cleartext to Traefik's `web`
            # entrypoint. This makes the chart render WEB_URL as https:// while
            # still binding the route to `web`.
            externalTermination: true

          env:
            # Fail the render instead of falling back to the chart's PUBLIC
            # example SECRET_KEY / LIVE_SERVER_SECRET_KEY.
            requireExplicitSecrets: true

          # Every credential the chart would otherwise render into a Secret from
          # values (and therefore into git) comes from one pre-created Secret
          # instead. Pointing all hooks at the same Secret is fine: the
          # workloads use envFrom, so a superset of keys is harmless.
          external_secrets:
            app_keys_existingSecret: plane-secret
            app_env_existingSecret: plane-secret
            live_env_existingSecret: plane-secret
            pgdb_existingSecret: plane-secret
            rabbitmq_existingSecret: plane-secret
            doc_store_existingSecret: plane-secret

          postgres:
            storageClass: longhorn
            volumeSize: 5Gi
          redis:
            storageClass: longhorn
            volumeSize: 256Mi
          rabbitmq:
            storageClass: longhorn
            volumeSize: 1Gi
          minio:
            # Off: uploads live in RustFS (apps/plane/rustfs.yaml, Service
            # plane-rustfs), because MinIO no longer publishes images. Plane
            # still talks S3 the MinIO way (USE_MINIO=1 in plane-secret signs
            # URLs for the public host); apps/plane/uploads-route.yaml sends
            # /uploads to RustFS.
            local_setup: false
            env:
              # Presigned upload URLs are built from request.scheme unless this
              # is set, and Django sees plain http behind Cloudflare, so the
              # browser blocked http://plane.silkepilon.dev/uploads as mixed
              # content. Only changes the URL scheme; Traefik -> RustFS is
              # still http in-cluster. Rendered into the chart's app env even
              # with local_setup off.
              minio_endpoint_ssl: true

          # Chart default pullPolicy is Always; the tags are immutable and the
          # Pis have small disks.
          api:
            pullPolicy: IfNotPresent
            # Same story as minio above, for the migrate Job. Also recreates the
            # api Deployment on real changes — about a minute of API downtime
            # per upgrade.
            annotations:
              argocd.argoproj.io/sync-options: Replace=true,Force=true
          web:
            pullPolicy: IfNotPresent
          space:
            pullPolicy: IfNotPresent
          admin:
            pullPolicy: IfNotPresent
          live:
            pullPolicy: IfNotPresent
          worker:
            pullPolicy: IfNotPresent
          beatworker:
            pullPolicy: IfNotPresent

          # The admin image is stock nginx, so GET /god-mode (no trailing slash)
          # gets nginx's directory redirect, which includes the container's
          # listen port: `Location: https://plane.silkepilon.dev:3000/god-mode/`.
          # Cloudflare does not proxy :3000, so the browser hangs. Answer that
          # one exact path from Traefik instead, before it reaches nginx.
          extraObjects:
            - apiVersion: traefik.io/v1alpha1
              kind: Middleware
              metadata:
                name: plane-god-mode-slash
                namespace: plane
              spec:
                redirectRegex:
                  regex: "^https?://([^/]+)/god-mode$"
                  replacement: "https://${1}/god-mode/"
                  permanent: true
            - apiVersion: traefik.io/v1alpha1
              kind: IngressRoute
              metadata:
                name: plane-god-mode-slash
                namespace: plane
              spec:
                entryPoints:
                  - web
                routes:
                  - match: Host(`plane.silkepilon.dev`) && Path(`/god-mode`)
                    kind: Rule
                    # Above the chart's PathPrefix(`/god-mode`) route.
                    priority: 1000
                    middlewares:
                      - name: plane-god-mode-slash
                    services:
                      - name: plane-admin
                        port: 3000
    # Git side: the ExternalSecret (and anything else not in the chart).
    - repoURL: https://github.com/SilkePilon/homelab
      targetRevision: main
      path: apps/plane
  destination:
    server: https://kubernetes.default.svc
    namespace: plane
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # ExternalSecret's CRD comes from the external-secrets app. On a fresh
      # cluster this app can sync first; skip the dry run and keep retrying
      # until ESO is up instead of giving up.
      - SkipDryRunOnMissingResource=true
      # Without this a sync would still apply the ignored timestamp below and
      # roll every pod.
      - RespectIgnoreDifferences=true
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  ignoreDifferences:
    # The chart stamps `timestamp: {{ now }}` on every pod template so that
    # `helm upgrade` always restarts pods. Under Argo CD that is a permanent
    # OutOfSync and a full rollout on every sync.
    - group: apps
      kind: Deployment
      namespace: plane
      jsonPointers:
        - /spec/template/metadata/annotations/timestamp
    - group: batch
      kind: Job
      namespace: plane
      jsonPointers:
        - /spec/template/metadata/annotations/timestamp
