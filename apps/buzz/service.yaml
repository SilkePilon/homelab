apiVersion: v1
kind: Service
metadata:
  name: buzz
  namespace: buzz
  labels:
    app.kubernetes.io/name: buzz
spec:
  # ClusterIP — public access arrives via Cloudflare Tunnel -> Traefik Ingress.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: buzz
  ports:
    - name: http
      port: 3000
      targetPort: http
    - name: metrics
      port: 9102
      targetPort: metrics
