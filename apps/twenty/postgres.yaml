---
# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL 16 — Twenty's primary datastore.
# Service DNS: twenty-db.twenty.svc.cluster.local  (referenced as `twenty-db`
# inside the namespace by PG_DATABASE_URL in the twenty-secret).
# Database name is `default` to match Twenty's expected connection string.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-db
  namespace: twenty
  labels:
    app.kubernetes.io/name: twenty-db
spec:
  replicas: 1
  # ReadWriteOnce PVC — only one writer at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: twenty-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: twenty-db
    spec:
      # postgres:16 starts as root then drops to the postgres user via its own
      # entrypoint (it chowns PGDATA itself), so no custom securityContext.
      containers:
        - name: postgres
          image: postgres:18
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: default
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: twenty-secret
                  key: PG_DATABASE_PASSWORD
            # Keep data out of the volume root so lost+found never collides.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "default"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "default"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: twenty-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: twenty-db
  namespace: twenty
  labels:
    app.kubernetes.io/name: twenty-db
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: twenty-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
