---
# ─────────────────────────────────────────────────────────────────────────────
# Open WebUI Deployment
# Image: ghcr.io/open-webui/open-webui
# Port:  8080
# Data:  /app/backend/data  (PVC open-webui-data)
#
# BEFORE applying:
#   1. Create the namespace first:
#        kubectl create namespace open-webui
#   2. Then create the secret (NOT committed to git):
#        kubectl create secret generic open-webui-secret -n open-webui \
#          --from-literal=WEBUI_SECRET_KEY="$(openssl rand -hex 32)"
#
# WEBUI_SECRET_KEY signs session tokens. If it is missing, the app generates a
# fresh one on every container start and everyone is logged out on each
# restart. Back it up.
#
# MODEL PROVIDERS are configured in the admin UI, not here — Admin Panel →
# Settings → Connections. They are stored in the database on the PVC, so they
# survive restarts. For Gemini, add an OpenAI-compatible connection:
#   URL: https://generativelanguage.googleapis.com/v1beta/openai
#   Key: <your Google AI Studio API key>
# Deliberately no OPENAI_* env vars: those seed the same settings on first
# boot and then take precedence over what the UI shows, which makes the UI
# confusing to reason about.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-webui
spec:
  replicas: 0
  # Recreate: PVC is ReadWriteOnce; only one pod may write at a time.
  # Scaling past 1 replica also needs external Postgres (DATABASE_URL) —
  # the bundled SQLite database does not support multiple writers.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
    spec:
      # The upstream image ships as root (UID 0) and its start.sh writes to
      # /app/backend/data and to the chroma cache under $HOME. Running as a
      # non-root user requires rebuilding the image with UID/GID build args.
      securityContext:
        fsGroup: 0
        runAsUser: 0
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.11.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: "Etc/UTC"
            # Public URL — used for links in share/notification flows.
            - name: WEBUI_URL
              value: "https://webui.silkepilon.dev"
            # No Ollama in this cluster; stops the backend from repeatedly
            # probing a non-existent endpoint and flooding the logs.
            - name: ENABLE_OLLAMA_API
              value: "false"
            # Public hostname — keep registration closed.
            # To create the FIRST (admin) account, temporarily flip this:
            #   kubectl set env deploy/open-webui ENABLE_SIGNUP=true -n open-webui
            # register at https://webui.silkepilon.dev, then let Argo CD's
            # selfHeal revert it (or run: argocd app sync open-webui).
            # The first account created automatically becomes the admin.
            - name: ENABLE_SIGNUP
              value: "false"
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secret
                  key: WEBUI_SECRET_KEY
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: 500m
              # The bundled all-MiniLM-L6-v2 embedding model is loaded into
              # memory the first time RAG is used.
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          # First boot runs the full Alembic migration chain and downloads the
          # all-MiniLM-L6-v2 embedding model from HuggingFace (~40s on a good
          # connection, much longer on a bad one). Uvicorn does not accept
          # connections until that finishes, so /health refuses connections
          # for the whole window. The startupProbe absorbs it and holds the
          # other two probes off until the app answers — without it, liveness
          # would kill the pod mid-download and restart the loop.
          # 60 × 10s = 10 minutes of grace. The model cache lands on the PVC,
          # so later restarts pass on the first try.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
