---
# ─────────────────────────────────────────────────────────────────────────────
# Hermes Agent Deployment
# Image: nousresearch/hermes-agent  (Docker Hub)
#
# Two containers share the hermes-data PVC (/opt/data = ~/.hermes):
#
#   gateway    — the core AI agent process. Reads inbound Signal messages from
#                signal-cli via SSE, calls the configured LLM, sends replies.
#   dashboard  — optional web UI on port 9119 to manage profiles, keys, and
#                view conversations.  Bind address changed to 0.0.0.0 so the
#                K8s Service can reach it (upstream default is 127.0.0.1).
#
# ⚠️  Security: the dashboard stores LLM API keys and has no built-in auth.
#     Protect it with Cloudflare Access or keep it off the public internet.
#     The Traefik ingress routes to it via the Cloudflare Tunnel — make sure
#     you enable Cloudflare Access (Zero Trust) on hermes.yourdomain.com.
#
# ── PREREQUISITE SECRET ──────────────────────────────────────────────────────
# Create this before applying (see kustomization.yaml for the full command):
#
#   kubectl create secret generic hermes-secret -n hermes \
#     --from-literal=SIGNAL_ACCOUNT="+1234567890" \
#     --from-literal=SIGNAL_ALLOWED_USERS="+1234567890" \
#     --from-literal=OPENROUTER_API_KEY="sk-or-..."
#
# ── LLM PROVIDER ─────────────────────────────────────────────────────────────
# The secret env vars below follow Hermes' own naming conventions.
# Add whichever provider key you use:
#   OPENROUTER_API_KEY   → openrouter.ai
#   ANTHROPIC_API_KEY    → api.anthropic.com
#   OPENAI_API_KEY       → api.openai.com
#   GEMINI_API_KEY       → Google AI Studio
# The model is configured in ~/.hermes/config.yaml on first run.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  replicas: 1
  # Recreate: hermes-data PVC is ReadWriteOnce; both containers in this pod
  # mount it, so there can only ever be one pod at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      # Hermes runs as UID 10000 (HERMES_UID default in docker-compose).
      # fsGroup ensures the PVC is writable by that UID on first mount.
      securityContext:
        fsGroup: 10000

      initContainers:
        # Wait for signal-cli to be ready before starting the gateway.
        # Avoids a race where the gateway tries to connect before signal-cli
        # has finished loading its account data on first boot.
        - name: wait-for-signal-cli
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for signal-cli to be ready..."
              until wget -qO- http://signal-cli:8080/api/v1/check >/dev/null 2>&1; do
                echo "signal-cli not ready yet, retrying in 5s..."; sleep 5;
              done
              echo "signal-cli is ready."
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

      containers:
        # ── Gateway — core agent process ──────────────────────────────────────
        - name: gateway
          image: nousresearch/hermes-agent:latest
          imagePullPolicy: Always
          command: ["gateway", "run"]
          env:
            - name: HERMES_UID
              value: "10000"
            - name: HERMES_GID
              value: "10000"
            # Signal integration
            - name: SIGNAL_HTTP_URL
              value: "http://signal-cli:8080"
            - name: SIGNAL_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: SIGNAL_ACCOUNT
            - name: SIGNAL_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: SIGNAL_ALLOWED_USERS
                  optional: true
            # LLM provider keys — add the one(s) you use to hermes-secret
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: OPENROUTER_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: OPENAI_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: GEMINI_API_KEY
                  optional: true
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi

        # ── Dashboard — web UI on port 9119 ───────────────────────────────────
        # ⚠️  See security warning in header — protect with Cloudflare Access.
        - name: dashboard
          image: nousresearch/hermes-agent:latest
          imagePullPolicy: Always
          # 0.0.0.0 instead of 127.0.0.1 so the K8s Service can reach it.
          command: ["dashboard", "--host", "0.0.0.0", "--no-open"]
          env:
            - name: HERMES_UID
              value: "10000"
            - name: HERMES_GID
              value: "10000"
          ports:
            - name: dashboard
              containerPort: 9119
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: dashboard
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: dashboard
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 4

      volumes:
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-data
