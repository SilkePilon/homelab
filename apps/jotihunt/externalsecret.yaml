---
# jotihunt-secret, synced from Infisical (project homelab / prod / folder /jotihunt/jotihunt-secret).
# JWT, Traccar token, VAPID, Telegram/Life360/Jotiboard session keys, NS key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jotihunt-secret
  namespace: jotihunt
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: jotihunt-secret
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /jotihunt/jotihunt-secret
        name:
          regexp: ".*"
---
# jotihunt-admin-login, synced from Infisical (project homelab / prod / folder /jotihunt/jotihunt-admin-login).
# email/password. Not mounted by any pod; kept so the login survives a rebuild.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jotihunt-admin-login
  namespace: jotihunt
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: jotihunt-admin-login
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /jotihunt/jotihunt-admin-login
        name:
          regexp: ".*"
---
# jotihunt-traccar-admin, synced from Infisical (project homelab / prod / folder /jotihunt/jotihunt-traccar-admin).
# Traccar admin email/password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jotihunt-traccar-admin
  namespace: jotihunt
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: jotihunt-traccar-admin
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /jotihunt/jotihunt-traccar-admin
        name:
          regexp: ".*"
