# ── Argo CD Application — pelican ─────────────────────────────────────────────
# Pelican game panel + Wings daemon (Minecraft servers), on the amd64
# EliteDesks, exposed on the LAN at 192.168.0.158 (Panel :8088, Wings :8080,
# games :25565-25569). No tunnel, no tailnet.
#
# The Panel syncs and runs on its own. The Wings pod waits on a Secret that
# can only be produced AFTER the Panel is installed and a Node exists in its
# UI — see apps/pelican/README.md. Until then the wings pod shows
# Init:0/2 with a FailedMount event ("secret \"pelican-wings-config\" not
# found"), and the Application shows Progressing.
# That is the expected first-sync state, not a failure.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pelican
  namespace: argocd
  # Argo CD will delete its own Application resource if the file is removed
  # from Git. It will NOT delete the deployed resources unless prune: true
  # is also set. Leave this in place for normal operation.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/SilkePilon/homelab
    targetRevision: main
    path: apps/pelican
  destination:
    server: https://kubernetes.default.svc
    namespace: pelican
  syncPolicy:
    automated:
      prune: true       # delete K8s resources removed from Git
      selfHeal: true    # re-apply if someone manually modifies the cluster
    syncOptions:
      - CreateNamespace=true    # creates the namespace if it doesn't exist
      - ServerSideApply=true    # avoids annotation-size limits on large CRDs
