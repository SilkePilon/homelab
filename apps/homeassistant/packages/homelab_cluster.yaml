# GENERATED by ../generate-cluster-package.py - edit that, not this.
# Homelab cluster health from Prometheus, one REST call per query.
rest:
  - resource: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
    scan_interval: 60
    timeout: 15
    params:
      query: 'sum(kube_node_status_condition{condition="Ready",status="true"})'
    sensor:
      - name: 'Homelab Nodes ready'
        unique_id: homelab_nodes_ready
        value_template: '{% set r = value_json.data.result %}{{ (r[0].value[1] | float) | int if r else none }}'
        icon: mdi:server-network
        state_class: measurement
  - resource: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
    scan_interval: 60
    timeout: 15
    params:
      query: 'count(kube_node_info)'
    sensor:
      - name: 'Homelab Nodes total'
        unique_id: homelab_nodes_total
        value_template: '{% set r = value_json.data.result %}{{ (r[0].value[1] | float) | int if r else none }}'
        icon: mdi:server
        state_class: measurement
  - resource: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
    scan_interval: 60
    timeout: 15
    params:
      query: '100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])))'
    sensor:
      - name: 'Homelab Cluster CPU'
        unique_id: homelab_cpu
        value_template: '{% set r = value_json.data.result %}{{ (r[0].value[1] | float) | round(1) if r else none }}'
        unit_of_measurement: '%'
        icon: mdi:cpu-64-bit
        state_class: measurement
  - resource: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
    scan_interval: 60
    timeout: 15
    params:
      query: '100 * (1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes))'
    sensor:
      - name: 'Homelab Cluster memory'
        unique_id: homelab_memory
        value_template: '{% set r = value_json.data.result %}{{ (r[0].value[1] | float) | round(1) if r else none }}'
        unit_of_measurement: '%'
        icon: mdi:memory
        state_class: measurement
  - resource: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
    scan_interval: 60
    timeout: 15
    params:
      query: 'sum(kube_pod_status_phase{phase="Running"})'
    sensor:
      - name: 'Homelab Pods running'
        unique_id: homelab_pods_running
        value_template: '{% set r = value_json.data.result %}{{ (r[0].value[1] | float) | int if r else none }}'
        icon: mdi:cube-outline
        state_class: measurement
  - resource: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
    scan_interval: 60
    timeout: 15
    params:
      query: 'sum(kube_pod_status_phase{phase=~"Pending|Failed|Unknown"}) or vector(0)'
    sensor:
      - name: 'Homelab Pods unhealthy'
        unique_id: homelab_pods_unhealthy
        value_template: '{% set r = value_json.data.result %}{{ (r[0].value[1] | float) | int if r else none }}'
        icon: mdi:cube-off-outline
        state_class: measurement
  - resource: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
    scan_interval: 60
    timeout: 15
    params:
      query: 'count(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1) or vector(0)'
    sensor:
      - name: 'Homelab Containers crash-looping'
        unique_id: homelab_crashloops
        value_template: '{% set r = value_json.data.result %}{{ (r[0].value[1] | float) | int if r else none }}'
        icon: mdi:restart-alert
        state_class: measurement
  - resource: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
    scan_interval: 60
    timeout: 15
    params:
      query: 'round(sum(increase(kube_pod_container_status_restarts_total[1h]))) or vector(0)'
