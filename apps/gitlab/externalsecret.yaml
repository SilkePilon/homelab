---
# gitlab-secret, synced from Infisical (project homelab / prod / folder /gitlab).
# GITLAB_ROOT_PASSWORD, only read on an empty volume.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-secret
  namespace: gitlab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: gitlab-secret
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /gitlab
        name:
          regexp: ".*"
