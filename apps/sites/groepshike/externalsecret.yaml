---
# groepshike-secret, synced from Infisical (project homelab / prod / folder /groepshike).
# Postgres + DATABASE_URL, PAYLOAD_SECRET, RustFS keys, SITE_PASSWORD, SMTP login.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: groepshike-secret
  namespace: groepshike
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: groepshike-secret
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /groepshike
        name:
          regexp: ".*"
