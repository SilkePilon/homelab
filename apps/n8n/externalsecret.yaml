---
# n8n-secret, synced from Infisical (project homelab / prod / folder /n8n).
# Keys: N8N_ENCRYPTION_KEY — protects n8n's stored credentials. Never change
# it: if it changes, every saved credential becomes unreadable.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: n8n-secret
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /n8n
        name:
          regexp: ".*"
