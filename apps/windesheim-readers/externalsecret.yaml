---
# windesheim-readers-secret, synced from Infisical (project homelab / prod / folder /windesheim-readers).
# APP_SECRET (never change it), Resend key + sender.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: windesheim-readers-secret
  namespace: windesheim-readers
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: windesheim-readers-secret
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /windesheim-readers
        name:
          regexp: ".*"
