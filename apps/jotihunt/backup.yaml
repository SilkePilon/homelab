# ── MongoDB backups ──────────────────────────────────────────────────────────
# mongodump of the `jotihunt` database every 30 min to the jotihunt-backups PVC
# (3 Longhorn replicas, separate from the MongoDB volume), keeping 48 h.
# There is no Longhorn backup target, so copy a dump off the cluster by hand
# now and then (see the cutover runbook).
#
# Restore (newest file first: ls -t /backups):
#   kubectl -n jotihunt exec -i deploy/mongodb -- mongorestore --archive --gzip --drop < <file>
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodump
  namespace: jotihunt
  labels:
    app.kubernetes.io/name: mongodump
spec:
  schedule: "*/30 * * * *"
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mongodump
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
            - name: mongodump
              image: mongo:9.0.4@sha256:dc28ed5a9d0fc616903c3f463bb1e53b92b49f441721b91926e87d90bf957ce8
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  set -e
                  f=/backups/jotihunt-$(date +%Y%m%dT%H%M).archive.gz
                  mongodump --uri=mongodb://mongodb:27017/jotihunt --archive="$f.tmp" --gzip
                  mv "$f.tmp" "$f"
                  find /backups -name 'jotihunt-*.archive.gz*' -mmin +2880 -delete
                  ls -la /backups | tail -3
              env:
                - name: TZ
                  value: "Europe/Amsterdam"
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: jotihunt-backups
