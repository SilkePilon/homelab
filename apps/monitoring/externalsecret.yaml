---
# grafana-admin-creds, synced from Infisical (project homelab / prod / folder /monitoring/grafana-admin-creds).
# Keys: admin-user / admin-password — Grafana admin login.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-creds
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: grafana-admin-creds
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /monitoring/grafana-admin-creds
        name:
          regexp: ".*"
