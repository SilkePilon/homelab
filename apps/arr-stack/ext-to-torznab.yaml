# ── ext-to-torznab (Torznab API proxy for ext.to) ────────────────────────────
# WebUI/API: port 5000  (kubectl port-forward -n arr-stack svc/ext-to-torznab 5000:5000)
#
# Exposes a standards-compliant Torznab feed by scraping ext.to — plain HTTP
# when the mirror allows it, FlareSolverr when Cloudflare challenges. Natively
# supports Sonarr, Radarr, and Lidarr — add it as a Torznab indexer in each app:
#
#   Settings → Indexers → Add → Torznab
#     URL:     http://ext-to-torznab:5000
#     API Key: leave blank (or set API_KEY in flaresolverr.yaml and enter it here)
#
# The container itself is defined in flaresolverr.yaml: it runs inside the
# FlareSolverr pod so that it shares the gluetun VPN egress IP with Chromium.
# Cloudflare binds the solved cf_clearance cookie to that IP, so this is what
# lets the proxy use its fast plain-HTTP path instead of going through the
# browser for every request. This file only keeps the stable Service name.
#
# This app is stateless — no PVC required.
apiVersion: v1
kind: Service
metadata:
  name: ext-to-torznab
  namespace: arr-stack
  labels:
    app.kubernetes.io/name: ext-to-torznab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flaresolverr
  ports:
    - name: api
      port: 5000
      targetPort: torznab
