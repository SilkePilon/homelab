# ── windesheim-readers Ingress ────────────────────────────────────────────────
# Cloudflare Tunnel → Traefik → windesheim-readers Service → Pod.
#
# In CF Zero Trust → Networks → Tunnels → homelab → Public Hostnames, add:
#   Subdomain: learn   Domain: silkepilon.dev
#   Service:   HTTP    http://traefik.kube-system.svc.cluster.local:80
#
# Quiz battles use a WebSocket on /api/battle/ws; Cloudflare and Traefik pass
# it through without extra config. Reader PDF uploads are up to 50 MB (under
# Cloudflare's 100 MB request limit).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: windesheim-readers
  namespace: windesheim-readers
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: learn.silkepilon.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: windesheim-readers
                port:
                  name: http
