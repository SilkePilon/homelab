# ─────────────────────────────────────────────────────────────────────────────
# MySQL 8.4 LTS — a standalone database for schoolwork. No cluster workload
# consumes it; its only client is a laptop on the tailnet.
#
# Access is root@'%', deliberately. That makes the tailnet ACL the real
# security boundary, not the MySQL grant table — any device that can reach
# tag:k8s can also DROP DATABASE. See the design note in
# docs/superpowers/specs/2026-09-17-mysql-design.md.
#
# Service DNS inside the cluster: mysql.mysql.svc.cluster.local:3306
# From the tailnet:                mysql.<tailnet>.ts.net:3306
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: mysql
  labels:
    app.kubernetes.io/name: mysql
spec:
  replicas: 1
  # ReadWriteOnce PVC — only one writer at a time, so never two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
    spec:
      # The mysql:8.4 image publishes arm64, but the InnoDB buffer pool is a
      # poor fit for a shared Pi. The three amd64 minis have the headroom.
      nodeSelector:
        kubernetes.io/arch: amd64
      # The image starts as root and drops to the mysql user via its own
      # entrypoint (it chowns the datadir itself), so no custom securityContext.
      containers:
        - name: mysql
          image: mysql:26.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            # Read by the entrypoint ONLY on first boot, while the volume is
            # empty. Changing the Secret afterwards does not rotate it.
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: school
            # Already the image default; set explicitly because it is the most
            # consequential property of this deployment.
            - name: MYSQL_ROOT_HOST
              value: "%"
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Do NOT set MYSQL_PWD here. The entrypoint runs its own mysql
          # client calls against the temporary server while root still has an
          # empty password; the client reads MYSQL_PWD automatically, so those
          # calls fail with ERROR 1045 and initialisation aborts after the
          # datadir is written but before root@'%' and MYSQL_DATABASE exist.
          #
          # First boot initialises the data directory on a fresh Longhorn
          # volume, which is slow, and the temporary server listens on the
          # socket only (port 0). A TCP ping therefore fails for the whole of
          # initialisation, which is exactly what the startup probe wants.
          startupProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            periodSeconds: 10
            failureThreshold: 30
          # Readiness authenticates for real. `mysqladmin ping` answers "alive"
          # even when the credentials are rejected, so it cannot tell a working
          # server from one whose root account was never set up.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - exec mysql -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" -e 'SELECT 1' >/dev/null 2>&1
            periodSeconds: 10
          # Liveness only asks whether the server still answers. It must not
          # depend on credentials, or a password change would kill the pod.
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
