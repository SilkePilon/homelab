# Builds images/t3code/ into ghcr.io/silkepilon/t3code.
#
# Tags: `latest` and the commit SHA. apps/t3code/deployment.yaml pins
# `latest@sha256:...`; Renovate opens a PR when the digest moves. It does not
# automerge it (see .github/renovate.json5) because a rollout kills any agent
# turn that is running at that moment.
name: t3code image

on:
  push:
    branches: [main]
    paths:
      - images/t3code/**
      - .github/workflows/t3code-image.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/silkepilon/t3code
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      # amd64 only: the Deployment is pinned to the EliteDesks.
      - uses: docker/build-push-action@v7
        with:
          context: images/t3code
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
