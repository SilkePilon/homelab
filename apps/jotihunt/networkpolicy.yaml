# ── MongoDB: same namespace only ─────────────────────────────────────────────
# MongoDB has no auth, so only pods in this namespace (server, mongodump) may
# connect. Without this, any pod in the cluster (including the agent
# workloads with shell access) could reach mongodb.jotihunt:27017.
# `kubectl exec` into the mongodb pod (restore) is not affected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-same-namespace
  namespace: jotihunt
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 27017
          protocol: TCP
---
# ── GraphHopper router: server only ──────────────────────────────────────────
# The router's admin port (8990, POST /rebuild downloads ~1.3 GB and swaps the
# graph) has no auth, so only the server pod may reach the router at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: graphhopper-server-only
  namespace: jotihunt
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: graphhopper
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: server
      ports:
        - port: 8989
          protocol: TCP
        - port: 8990
          protocol: TCP
