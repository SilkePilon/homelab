# ── Traefik Ingress ──────────────────────────────────────────────────────────
# Exposes Stirling PDF via Cloudflare Tunnel → Traefik → stirling-pdf Service.
#
# In CF Zero Trust → Tunnel → Public Hostnames, add:
#   Subdomain: pdf   Domain: silkepilon.dev
#   Service:   HTTP  http://traefik.kube-system.svc.cluster.local:80
#
# Cloudflare terminates TLS; Traefik only ever sees cleartext on `web`.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: pdf.silkepilon.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stirling-pdf
                port:
                  name: http
