# ── NUT (Network UPS Tools) Prometheus exporter ───────────────────────────────
# Scrapes the APC Back-UPS BX1600MI exposed by the NUT server running on the
# out-of-cluster tasks node (192.168.1.172:3493). NUT allows anonymous reads by
# default, so no credentials are required here.
#
# Metrics are published under the `network_ups_tools_` namespace, e.g.
#   network_ups_tools_battery_charge
#   network_ups_tools_battery_runtime      (seconds)
#   network_ups_tools_input_voltage
#   network_ups_tools_ups_load
#   network_ups_tools_battery_voltage
#   network_ups_tools_ups_status{flag="OL"}  (1/0 per status flag)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nut-exporter
  namespace: monitoring
  labels:
    app: nut-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nut-exporter
  template:
    metadata:
      labels:
        app: nut-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: nut-exporter
          image: ghcr.io/druggeri/nut_exporter:3.3.0
          args:
            - --nut.server=192.168.1.172
            - --nut.serverport=3493
            # Include battery.runtime (not in the exporter's default var set).
            - --nut.vars_enable=battery.charge,battery.runtime,battery.voltage,battery.voltage.nominal,input.voltage,input.voltage.nominal,ups.load,ups.status
          ports:
            - containerPort: 9199
              name: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: nut-exporter
  namespace: monitoring
  labels:
    app: nut-exporter
spec:
  selector:
    app: nut-exporter
  ports:
    - name: metrics
      port: 9199
      targetPort: metrics
