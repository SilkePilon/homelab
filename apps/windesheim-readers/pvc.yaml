# ── windesheim-readers PVC ────────────────────────────────────────────────────
# /app/data inside the container: the SQLite database (app.db) plus uploads/
# (reader PDFs and the generated Luisterles MP3s, ~3 MB per lesson). Longhorn so
# the pod can move between nodes; the image is multi-arch (amd64 + arm64).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: windesheim-readers-data
  namespace: windesheim-readers
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
