---
# werkplekinspectie-secret, synced from Infisical (project homelab / prod / folder /werkplekinspectie).
# Mail + SMTP login, and all organisation details (this repo is public, so they stay out of git).
# The keys are listed in the header of deployment.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: werkplekinspectie-secret
  namespace: werkplekinspectie
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: werkplekinspectie-secret
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /werkplekinspectie
        name:
          regexp: ".*"
