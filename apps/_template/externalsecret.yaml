---
# <APP_NAME>-secret, synced from Infisical (project homelab / prod / folder
# /<APP_NAME>). Every key in that folder becomes a key in the Secret.
# See apps/infra/external-secrets/README.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: <APP_NAME>-secret
  namespace: <APP_NAME>
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: <APP_NAME>-secret
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /<APP_NAME>
        name:
          regexp: ".*"
