# ── Traefik Ingress ──────────────────────────────────────────────────────────
# Exposes Twenty via Cloudflare Tunnel → Traefik → this Service.
#
# Cloudflare Tunnel terminates TLS at the edge (HTTPS to the world, HTTP
# inside the cluster). The tunnel's public hostname must match `host:` below
# AND SERVER_URL in deployment.yaml.
#
# To switch from .local → real domain:
#   1. Set host below to e.g. twenty.yourdomain.com
#   2. Update SERVER_URL in deployment.yaml to https://twenty.yourdomain.com
#   3. In CF Zero Trust → Tunnel → Public Hostnames, point twenty.yourdomain.com
#      at HTTP http://traefik.kube-system.svc.cluster.local:80
#
# For LAN-only access you can still add twenty.yourdomain.com to /etc/hosts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: twenty
  namespace: twenty
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: twenty.aethero.studio  # <-- replace with your real hostname
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: twenty
                port:
                  name: http
