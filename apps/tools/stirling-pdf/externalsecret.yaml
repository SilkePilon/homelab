---
# stirling-pdf-secret, synced from Infisical (project homelab / prod / folder /stirling-pdf).
# Keys: SECURITY_INITIALLOGIN_USERNAME / _PASSWORD — first admin login, only read on an empty volume.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stirling-pdf-secret
  namespace: stirling-pdf
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: stirling-pdf-secret
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /stirling-pdf
        name:
          regexp: ".*"
