---
# forgejo-runner-secret: only RUNNER_SECRET from the Infisical folder /forgejo,
# the same value the forgejo pod registers the runner with. One copy, so the
# two sides can never drift apart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner-secret
  namespace: forgejo-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: forgejo-runner-secret
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /forgejo
        name:
          regexp: "^RUNNER_SECRET$"
