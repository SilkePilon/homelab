apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Plain Kustomize base — consumed identically by Argo CD and Flux CD.
namespace: twenty

# ─────────────────────────────────────────────────────────────────────────────
# Twenty CRM — self-hosted, open-source CRM.
#   Docs: https://docs.twenty.com/developers/self-host
#
# Topology:
#   twenty        Deployment  server + worker (one pod, shared local storage)
#   twenty-db     Deployment  PostgreSQL 18   (records / source of truth)
#   twenty-redis  Deployment  Redis 7         (BullMQ job queue + cache)
#
# Secret twenty-secret is synced from Infisical (folder /twenty, NOT in git).
# On a fresh install add these keys to that folder:
#
#   APP_SECRET            openssl rand -base64 32
#   ENCRYPTION_KEY        openssl rand -base64 32
#   PG_DATABASE_PASSWORD  openssl rand -hex 24  (call it PG_PASS)
#   PG_DATABASE_URL       postgres://postgres:<PG_PASS>@twenty-db:5432/default
#
#   Back up ENCRYPTION_KEY + APP_SECRET. Losing ENCRYPTION_KEY makes every
#   secret stored in the database permanently unreadable.
#
# THEN:
#   1. Edit deployment.yaml SERVER_URL + ingress.yaml host to your hostname.
#   2. Add `<k3s-node-ip>  twenty.local` to /etc/hosts where you browse from.
#   3. Open http://twenty.local — the FIRST account you create becomes the
#      workspace admin (single-workspace mode; new signups then close).
#   4. Further config (SMTP, Google/Microsoft OAuth, S3) is done in-app under
#      Settings -> Admin Panel -> Configuration Variables.
# ─────────────────────────────────────────────────────────────────────────────

resources:
  - namespace.yaml
  - pvc.yaml
  - postgres.yaml
  - redis.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - externalsecret.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
    includeSelectors: false

# Keep only 2 old ReplicaSets/ControllerRevisions per workload instead of the
# Kubernetes default of 10. Without this the cluster accumulates dozens of
# empty ReplicaSets, and each retained revision pins its container image on the
# node — costly on the Pis, which have 28-58Gi disks.
patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/revisionHistoryLimit
        value: 2
  - target:
      kind: DaemonSet
    patch: |
      - op: add
        path: /spec/revisionHistoryLimit
        value: 2
