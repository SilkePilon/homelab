apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Plain Kustomize base — consumed identically by Argo CD and Flux CD.
namespace: pelican

# ─────────────────────────────────────────────────────────────────────────────
# pelican — Pelican game panel + Wings daemon, for Minecraft servers.
# Runs on the amd64 EliteDesks only. LAN-only; a router port-forward to a
# node IP is how it goes public later.
#
# BEFORE this stack is usable — see README.md for the full sequence:
#
#  1. Push. Argo CD syncs. The Panel comes up; the Wings pod waits on a Secret.
#
#  2. Open http://192.168.0.158:8088/installer and create the admin user.
#
#  3. In the Panel, Admin → Nodes → Create:
#       FQDN 192.168.0.158, port 8080, SFTP 2022, SSL off,
#       allocations 0.0.0.0 ports 25565-25569.
#
#  4. Node → Configuration tab → copy the YAML to ./config.yml, then create
#     the secret (NOT committed to git):
#       kubectl -n pelican create secret generic pelican-wings-config \
#         --from-file=config.yml=./config.yml
#
#  There is no Cloudflare Tunnel hostname, no Ingress and no tailnet exposure.
# ─────────────────────────────────────────────────────────────────────────────

resources:
  - namespace.yaml
  - pvc.yaml
  - panel.yaml
  - wings.yaml
  - service.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
    includeSelectors: false

# Keep only 2 old ReplicaSets/ControllerRevisions per workload instead of the
# Kubernetes default of 10. Without this the cluster accumulates dozens of
# empty ReplicaSets, and each retained revision pins its container image on the
# node — costly on the Pis, which have 28-58Gi disks.
patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/revisionHistoryLimit
        value: 2
  - target:
      kind: DaemonSet
    patch: |
      - op: add
        path: /spec/revisionHistoryLimit
        value: 2
