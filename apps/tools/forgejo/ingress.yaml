# ── Forgejo Ingress ───────────────────────────────────────────────────────────
# Cloudflare Tunnel → Traefik → this Service. Cloudflare terminates TLS.
#
# In the Cloudflare Zero Trust dashboard add:
#   Public Hostname → Subdomain: git   Domain: silkepilon.dev
#   Service         → HTTP     http://traefik.kube-system.svc.cluster.local:80
#
# Must match ROOT_URL in deployment.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo
  namespace: forgejo
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: git.silkepilon.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgejo
                port:
                  name: http
