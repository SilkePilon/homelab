apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Plain Kustomize base — consumed identically by Argo CD and Flux CD.
namespace: forgejo

# ─────────────────────────────────────────────────────────────────────────────
# forgejo — Forgejo at https://git.silkepilon.dev. Git over HTTPS only.
# Forgejo Actions CI runs on forgejo-runner (apps/tools/forgejo-runner).
#
# BEFORE applying this stack:
#
#  1. Fill the Infisical folder /forgejo (NOT committed to git); ESO syncs it
#     to forgejo-secret. Keys: SECRET_KEY, ADMIN_PASSWORD, RUNNER_SECRET.
#     See externalsecret.yaml and README.md.
#
#  2. Add a Cloudflare Tunnel public hostname entry:
#       Subdomain: git   Domain: silkepilon.dev
#       Service:   HTTP  http://traefik.kube-system.svc.cluster.local:80
#
# The admin user and the runner registration are created by the `setup`
# container in deployment.yaml; nothing to click.
# ─────────────────────────────────────────────────────────────────────────────

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - externalsecret.yaml

# The homelab theme. Hashed name, so editing the CSS rolls the pod; binary
# fonts land in binaryData automatically.
configMapGenerator:
  - name: forgejo-theme
    files:
      - theme/theme-homelab.css
      - theme/inter-latin-wght-normal.woff2
      - theme/jetbrains-mono-latin-wght-normal.woff2

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
    includeSelectors: false

# Keep only 2 old ReplicaSets/ControllerRevisions per workload instead of the
# Kubernetes default of 10. Without this the cluster accumulates dozens of
# empty ReplicaSets, and each retained revision pins its container image on the
# node — costly on the Pis, which have 28-58Gi disks.
patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/revisionHistoryLimit
        value: 2
