# ── werkplekinspectie Ingress ─────────────────────────────────────────────────
# Cloudflare Tunnel → Traefik → werkplekinspectie Service → Pod.
#
# In CF Zero Trust → Networks → Tunnels → homelab → Public Hostnames, add:
#   Subdomain: (empty)    Domain: werkplekinspectie.app
#   Service:   HTTP       http://traefik.kube-system.svc.cluster.local:80
#
# One inspection is at most ~11 MB (photos + signature), well under Cloudflare's
# 100 MB request limit.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: werkplekinspectie
  namespace: werkplekinspectie
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: werkplekinspectie.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: werkplekinspectie
                port:
                  name: http
