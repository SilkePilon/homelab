apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: |
    // ── Pod discovery ─────────────────────────────────────────────────────────
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      // Drop pods that are not running
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Pending|Succeeded|Failed|Completed"
        action        = "drop"
      }

      // Propagate pod labels to log stream labels
      rule {
        action = "labelmap"
        regex  = "__meta_kubernetes_pod_label_(.+)"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }

      // Build the host filesystem path to the container log file.
      // k3s / containerd path: /var/log/pods/<ns>_<name>_<uid>/<container>/<n>.log
      // Anchor on pod UID — it always appears at the end of the directory name,
      // so *<uid>*/<container>/*.log reliably matches across all namespaces.
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        regex         = "(.+)/(.+)"
        target_label  = "__path__"
        replacement   = "/var/log/pods/*$1*/$2/*.log"
      }
    }

    // ── Tail the discovered files ─────────────────────────────────────────────
    local.file_match "pods" {
      path_targets = discovery.relabel.pods.output
      sync_period  = "10s"
    }

    loki.source.file "pods" {
      targets    = local.file_match.pods.targets
      forward_to = [loki.process.pods.receiver]
    }

    // ── Parse and filter ──────────────────────────────────────────────────────
    loki.process "pods" {
      // CRI format used by containerd (default in k3s)
      stage.cri {}

      // Silently drop entries older than Loki's retention window (168h)
      // to avoid 400 errors when Alloy first reads pre-existing log files.
      stage.drop {
        older_than          = "168h"
        drop_counter_reason = "too_old"
      }

      forward_to = [loki.write.loki.receiver]
    }

    // ── Ship to Loki ──────────────────────────────────────────────────────────
    loki.write "loki" {
      endpoint {
        url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: alloy
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      # Tolerate all taints so alloy runs on every node (including control-plane)
      tolerations:
        - operator: Exists
      containers:
        - name: alloy
          image: grafana/alloy:v1.18.0
          args:
            - run
            - /etc/alloy/config.alloy
            # Positions/WAL live on a hostPath so they survive pod restarts.
            # NOT under /var/lib/alloy — the image ships that dir as 0770 473:473,
            # and with capabilities dropped, root has no CAP_DAC_OVERRIDE to enter it.
            - --storage.path=/var/lib/alloy-data
            - --server.http.listen-addr=0.0.0.0:12345
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 12345
              name: http
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy-data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: pods-logs
          hostPath:
            path: /var/log/pods
        - name: data
          hostPath:
            path: /var/lib/alloy-data
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
