# ── Argo CD Application — t3code ─────────────────────────────────────────────
# A headless T3 Code server for Claude Code agents, reachable over the tailnet
# at https://t3.<tailnet>.ts.net and nowhere else.
#
# No Secret is needed to sync. After the first sync, log the agent in to
# Claude and GitHub once and pair a client; see apps/t3code/README.md.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: t3code
  namespace: argocd
  # Temporary, while the ApplicationSet takes this app over: no cascade
  # delete, and the root app must not prune it when this file goes away.
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: default
  source:
    repoURL: https://github.com/SilkePilon/homelab
    targetRevision: main
    path: apps/t3code
  destination:
    server: https://kubernetes.default.svc
    namespace: t3code
  syncPolicy:
    automated:
      prune: true       # delete K8s resources removed from Git
      selfHeal: true    # re-apply if someone manually modifies the cluster
    syncOptions:
      - CreateNamespace=true    # creates the namespace if it doesn't exist
      - ServerSideApply=true    # avoids annotation-size limits on large CRDs
      # ExternalSecret's CRD comes from the external-secrets app. On a fresh
      # cluster this app can sync first; skip the dry run and keep retrying
      # until ESO is up instead of giving up.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
