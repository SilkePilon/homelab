---
# ─────────────────────────────────────────────────────────────────────────────
# Infisical Cloud (EU region) as the cluster-wide secret backend.
#
# Layout in Infisical: project "homelab", environment "prod", one folder per
# app (/n8n, /jotihunt, ...). An app reads its folder with an ExternalSecret,
# see README.md in this directory.
#
# Bootstrap secret — the ONE secret still created by hand (Infisical Cloud
# cannot reach the cluster API, so Kubernetes auth is not an option):
#
#   kubectl -n external-secrets create secret generic infisical-universal-auth \
#     --from-literal=clientId='...' \
#     --from-literal=clientSecret='...'
#
# Values come from the "eso-homelab" machine identity (Universal Auth).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: https://eu.infisical.com
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        # Must match the project slug shown in Infisical (Project Settings).
        projectSlug: homelab
        environmentSlug: prod
        secretsPath: /
