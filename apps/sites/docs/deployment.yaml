---
# ─────────────────────────────────────────────────────────────────────────────
# docs.silkepilon.dev — Fumadocs site from https://github.com/SilkePilon/docs
# Image: ghcr.io/silkepilon/docs:latest, a static export served by
# unprivileged nginx on :8080 (multi-arch, so it runs on the Pis too).
# No state, no secrets. New builds roll out via updater.yaml.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  namespace: docs
  labels:
    app.kubernetes.io/name: docs
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      # Spread the two replicas so one node going down keeps the site up.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: docs
      containers:
        - name: nginx
          image: ghcr.io/silkepilon/docs:latest
          # :latest is moved by every push to SilkePilon/docs; the updater
          # restarts the Deployment, and Always makes the restart pull it.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
