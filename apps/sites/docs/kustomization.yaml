apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# docs.silkepilon.dev — Fumadocs site, source in SilkePilon/docs.
# No secrets, no storage. Deployed by the ApplicationSet (folder = app).
namespace: docs

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - updater.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
    includeSelectors: false

patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/revisionHistoryLimit
        value: 2
