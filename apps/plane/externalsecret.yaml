---
# plane-secret, synced from Infisical (project homelab / prod / folder /plane).
# Django/live signing keys, Postgres, RabbitMQ, MinIO credentials + URLs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-secret
  namespace: plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: plane-secret
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /plane
        name:
          regexp: ".*"
