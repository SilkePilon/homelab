apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arr-stack
  namespace: argocd
  # Temporary, while the ApplicationSet takes this app over: no cascade
  # delete, and the root app must not prune it when this file goes away.
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: default
  source:
    repoURL: https://github.com/SilkePilon/homelab
    targetRevision: main
    path: apps/arr-stack
  destination:
    server: https://kubernetes.default.svc
  # The gluetun-rotate CronJob restarts byparr every 6 hours by writing a
  # kubectl.kubernetes.io/restartedAt annotation into the pod template. That
  # annotation is not in git, so with selfHeal enabled Argo would immediately
  # strip it back out — a second rollout, and a permanent OutOfSync flap.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: byparr
      namespace: arr-stack
      jsonPointers:
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # ExternalSecret's CRD comes from the external-secrets app. On a fresh
      # cluster this app can sync first; skip the dry run and keep retrying
      # until ESO is up instead of giving up.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
