# ── GitLab Ingress ────────────────────────────────────────────────────────────
# Cloudflare Tunnel → Traefik → this Service. Cloudflare terminates TLS.
#
# In the Cloudflare Zero Trust dashboard add:
#   Public Hostname → Subdomain: gitlab   Domain: silkepilon.dev
#   Service         → HTTP      http://traefik.kube-system.svc.cluster.local:80
#
# Must match external_url in deployment.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab
  namespace: gitlab
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: gitlab.silkepilon.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitlab
                port:
                  name: http
