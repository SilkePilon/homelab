apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # ───────────────────────────────────────────────────────────────────────────
  # Helm-sourced, like longhorn/plane/kured/gitlab-runner/external-secrets:
  # the Tailscale operator ships as a chart and carries its own CRDs
  # (Connector, ProxyClass, ProxyGroup, Recorder), so rendering it to static
  # manifests would mean re-rendering on every upgrade. Multi-source: the
  # chart plus apps/infra/tailscale, which holds the ExternalSecret.
  #
  # BEFORE this app can sync, see apps/infra/tailscale/README.md. In short:
  #   1. Add tag:k8s-operator and tag:k8s to the tailnet ACLs.
  #   2. Create an OAuth client tagged tag:k8s-operator.
  #   3. Add its client_id and client_secret keys to the Infisical folder
  #      /tailscale (NOT committed to git); ESO syncs them to `operator-oauth`.
  #
  # oauth.clientId / oauth.clientSecret are deliberately left unset. When they
  # are empty the chart creates no Secret of its own and mounts the
  # `operator-oauth` from Infisical instead, so no credential ever reaches git.
  # ───────────────────────────────────────────────────────────────────────────
  sources:
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.102.2
      helm:
        releaseName: tailscale-operator
        values: |
          installCRDs: true

          operatorConfig:
            hostname: homelab-k8s-operator
            logging: info
            defaultTags:
              - "tag:k8s-operator"

          # Reach the Kubernetes API over the tailnet instead of exposing 6443.
          # "true" runs the in-process proxy in auth mode, which impersonates
          # tailnet users/groups according to ACL grants.
          apiServerProxyConfig:
            mode: "true"
            allowImpersonation: "true"
    # Git side: the ExternalSecret (and anything else not in the chart).
    - repoURL: https://github.com/SilkePilon/homelab
      targetRevision: main
      path: apps/infra/tailscale
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # ExternalSecret's CRD comes from the external-secrets app. On a fresh
      # cluster this app can sync first; skip the dry run and keep retrying
      # until ESO is up instead of giving up.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  ignoreDifferences:
    # The operator writes its own device state back onto these; letting Argo CD
    # fight it causes a permanent OutOfSync.
    - group: apps
      kind: StatefulSet
      namespace: tailscale
      jsonPointers:
        - /spec/template/spec/containers/0/env
