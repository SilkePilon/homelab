---
# ─────────────────────────────────────────────────────────────────────────────
# Twenty CRM — application tier.
# Image: twentycrm/twenty  (single image runs both the API/front server and the
# background worker; the command decides the role).
#
# WHY server + worker in ONE pod:
#   Both processes share Twenty's local file storage
#   (/app/packages/twenty-server/.local-storage). On k3s the default
#   local-path StorageClass is ReadWriteOnce (node-local), so the only way two
#   processes can share that volume is to co-locate them in the same pod. This
#   also pins them to the same node automatically.
#   If you move file storage to S3 (STORAGE_TYPE=S_3), you can split the worker
#   into its own Deployment and scale it independently.
#
# Migrations + cron registration run in the SERVER container only. The worker
# has DISABLE_DB_MIGRATIONS / DISABLE_CRON_JOBS_REGISTRATION = true so the two
# never fight over schema changes (mirrors Twenty's official docker-compose).
#
# BEFORE applying — create the namespace + secret (NOT committed to git):
#
#   kubectl create namespace twenty
#
#   PG_PASS="$(openssl rand -hex 24)"
#   kubectl create secret generic twenty-secret -n twenty \
#     --from-literal=APP_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=ENCRYPTION_KEY="$(openssl rand -base64 32)" \
#     --from-literal=PG_DATABASE_PASSWORD="$PG_PASS" \
#     --from-literal=PG_DATABASE_URL="postgres://postgres:${PG_PASS}@twenty-db:5432/default"
#
#   BACK THESE UP. Losing ENCRYPTION_KEY = losing every secret stored in the DB
#   (OAuth tokens, app variables, TOTP secrets). APP_SECRET signs auth tokens.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty
  namespace: twenty
  labels:
    app.kubernetes.io/name: twenty
spec:
  replicas: 1
  # Recreate: the shared .local-storage PVC is ReadWriteOnce.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: twenty
  template:
    metadata:
      labels:
        app.kubernetes.io/name: twenty
    spec:
      # Twenty's image runs as UID 1000; fsGroup makes the mounted PVC writable.
      # This workload's former node pi52 failed when its SD card stopped
      # completing writes; the data was recovered (docs/pi52-recovery.md).
      # It is no longer pinned anywhere - the volume lives on Longhorn now.
      securityContext:
        fsGroup: 1000
      # Give Postgres a head start so the server's first migration run connects
      # cleanly instead of crash-looping while the DB initialises.
      initContainers:
        - name: wait-for-db
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h twenty-db -p 5432 -U postgres; do
                echo "waiting for twenty-db..."; sleep 2;
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        # ── API + front-end + migrations + cron registration ─────────────────
        - name: server
          image: twentycrm/twenty:v2.38.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_PORT
              value: "3000"
            # External URL users hit in the browser. MUST match the public
            # hostname configured in the Cloudflare Tunnel and ingress.yaml.
            - name: SERVER_URL
              value: "https://twenty.aethero.studio"
            - name: REDIS_URL
              value: "redis://twenty-redis:6379"
            - name: STORAGE_TYPE
              value: "local"
            - name: PG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: twenty-secret
                  key: PG_DATABASE_URL
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: twenty-secret
                  key: APP_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: twenty-secret
                  key: ENCRYPTION_KEY
          volumeMounts:
            - name: server-local-data
              mountPath: /app/packages/twenty-server/.local-storage
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
        # ── Background worker (job queue: sync, workflows, email, etc.) ───────
        - name: worker
          image: twentycrm/twenty:v2.38.1
          imagePullPolicy: IfNotPresent
          command: ["yarn", "worker:prod"]
          env:
            - name: SERVER_URL
              value: "https://twenty.aethero.studio"
            - name: REDIS_URL
              value: "redis://twenty-redis:6379"
            - name: STORAGE_TYPE
              value: "local"
            # Server owns migrations + cron; worker must not duplicate them.
            - name: DISABLE_DB_MIGRATIONS
              value: "true"
            - name: DISABLE_CRON_JOBS_REGISTRATION
              value: "true"
            - name: PG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: twenty-secret
                  key: PG_DATABASE_URL
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: twenty-secret
                  key: APP_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: twenty-secret
                  key: ENCRYPTION_KEY
          volumeMounts:
            - name: server-local-data
              mountPath: /app/packages/twenty-server/.local-storage
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 3Gi
      volumes:
        - name: server-local-data
          persistentVolumeClaim:
            claimName: twenty-server-data
