apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-store
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # The ClusterSecretStore that points ESO at Infisical. Kept apart from the
  # external-secrets Helm app so the CRDs exist before this is applied.
  source:
    repoURL: https://github.com/SilkePilon/homelab
    targetRevision: main
    path: apps/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # On a fresh cluster the ClusterSecretStore CRD does not exist until the
      # external-secrets app has synced; skip the dry run instead of failing.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
