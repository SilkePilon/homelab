---
# twenty-secret, synced from Infisical (project homelab / prod / folder /twenty).
# Postgres URL/password, APP_SECRET, ENCRYPTION_KEY.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: twenty-secret
  namespace: twenty
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: twenty-secret
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /twenty
        name:
          regexp: ".*"
