---
# ─────────────────────────────────────────────────────────────────────────────
# InvoiceNinja v5 Deployment
#
# Image: invoiceninja/invoiceninja-debian
#   The current (non-deprecated) image. Nginx, PHP-FPM and Chrome are all
#   bundled — no sidecar or initContainer required.
#
# First-run account seeding:
#   IN_USER_EMAIL / IN_PASSWORD are read on first startup to auto-create the
#   admin account. After the pod has started once, these env vars are safe
#   to remove (the account is stored in the DB).
#
# BEFORE applying:
#   1. kubectl create namespace invoiceninja
#   2. Create the secret (NOT committed to git):
#        kubectl create secret generic invoiceninja-secret \
#          --from-literal=APP_KEY="base64:$(openssl rand -base64 32)" \
#          --from-literal=DB_PASSWORD="$(openssl rand -hex 16)" \
#          --from-literal=MARIADB_ROOT_PASSWORD="$(openssl rand -hex 16)" \
#          --from-literal=IN_USER_EMAIL="devsilkepilon@gmail.com" \
#          --from-literal=IN_PASSWORD="<your-password>" \
#          -n invoiceninja
#
# APP_KEY is the Laravel encryption key — back it up; changing it breaks
# all encrypted data (client data, tokens, etc.).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoiceninja
  namespace: invoiceninja
  labels:
    app.kubernetes.io/name: invoiceninja
spec:
  replicas: 1
  # ReadWriteOnce PVC — only one writer at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: invoiceninja
  template:
    metadata:
      labels:
        app.kubernetes.io/name: invoiceninja
    spec:
      securityContext:
        fsGroup: 33  # www-data — ensures PVC is writable by the app
      containers:
        - name: app
          # invoiceninja-debian bundles nginx + PHP-FPM + Chrome in one image.
          image: invoiceninja/invoiceninja-debian:5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            # Must match the public hostname used by Cloudflare Tunnel.
            - name: APP_URL
              value: "https://invoice.aethero.studio"
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: invoiceninja-secret
                  key: APP_KEY
            - name: DB_HOST
              value: invoiceninja-mariadb
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: invoiceninja
            - name: DB_USERNAME
              value: invoiceninja
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: invoiceninja-secret
                  key: DB_PASSWORD
            # CF Tunnel terminates TLS; internal traffic is plain HTTP.
            - name: REQUIRE_HTTPS
              value: "false"
            # Trust all upstream proxies (Traefik + CF Tunnel).
            - name: TRUSTED_PROXIES
              value: "*"
            - name: LOG_CHANNEL
              value: stderr
            # sync: no separate queue worker needed for a homelab.
            - name: QUEUE_CONNECTION
              value: sync
            # Auto-seed the initial admin account on first startup.
            # Safe to remove after first successful boot.
            - name: IN_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: invoiceninja-secret
                  key: IN_USER_EMAIL
            - name: IN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: invoiceninja-secret
                  key: IN_PASSWORD
          volumeMounts:
            - name: invoiceninja-storage
              mountPath: /var/www/app/storage
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 6

      volumes:
        - name: invoiceninja-storage
          persistentVolumeClaim:
            claimName: invoiceninja-storage
