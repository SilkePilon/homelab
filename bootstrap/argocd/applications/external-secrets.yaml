apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # ───────────────────────────────────────────────────────────────────────────
  # External Secrets Operator — turns ExternalSecret resources into plain
  # Kubernetes Secrets, with the values read from Infisical Cloud. Two
  # sources: the chart, and apps/infra/external-secrets/ with the
  # ClusterSecretStore that points at Infisical.
  #
  # Installed by hand with `helm install` (chart 2.5.0) on 2026-06-02 and left
  # scaled to 0. Adopted into Argo CD on 2026-11-18 at chart 2.15.0.
  #
  # Helm-sourced, like longhorn — the chart carries ~20 CRDs.
  # ───────────────────────────────────────────────────────────────────────────
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.15.0
      helm:
        releaseName: external-secrets
        values: |
          installCRDs: true
    # Git side: the ClusterSecretStore.
    - repoURL: https://github.com/SilkePilon/homelab
      targetRevision: main
      path: apps/infra/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are too big for the client-side last-applied annotation.
      - ServerSideApply=true
      # On a fresh cluster the ClusterSecretStore CRD only exists once the
      # chart half of this same sync has applied.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
