apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Plain Kustomize base — consumed identically by Argo CD and Flux CD.
namespace: n8n

# ─────────────────────────────────────────────────────────────────────────────
# BEFORE applying this stack:
#
#  1. n8n-secret comes from Infisical (folder /n8n) via externalsecret.yaml.
#     For a fresh install, add N8N_ENCRYPTION_KEY there first
#     (`openssl rand -hex 32`). Never change it afterwards — all saved
#     credentials become unreadable.
#
#  2. Edit deployment.yaml → WEBHOOK_URL to point at your cluster's IP or
#     hostname so external webhooks can reach n8n.
#
#  3. (Optional) Increase resources.limits.memory if you run large workflows.
# ─────────────────────────────────────────────────────────────────────────────

resources:
  - namespace.yaml
  - pvc.yaml
  - service.yaml
  - deployment.yaml
  - ingress.yaml
  - externalsecret.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
    includeSelectors: false

# Keep only 2 old ReplicaSets/ControllerRevisions per workload instead of the
# Kubernetes default of 10. Without this the cluster accumulates dozens of
# empty ReplicaSets, and each retained revision pins its container image on the
# node — costly on the Pis, which have 28-58Gi disks.
patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/revisionHistoryLimit
        value: 2
  - target:
      kind: DaemonSet
    patch: |
      - op: add
        path: /spec/revisionHistoryLimit
        value: 2
