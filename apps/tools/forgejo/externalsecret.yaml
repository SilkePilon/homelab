---
# forgejo-secret, synced from Infisical (project homelab / prod / folder /forgejo).
#   SECRET_KEY      encrypts 2FA seeds and other secrets in the database.
#                   Never change it once set; losing it breaks those.
#   ADMIN_PASSWORD  first login of the admin user, only used when the user
#                   does not exist yet. Change it in the UI afterwards.
#   RUNNER_SECRET   40 hex chars shared with forgejo-runner (openssl rand -hex 20).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-secret
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: forgejo-secret
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /forgejo
        name:
          regexp: ".*"
