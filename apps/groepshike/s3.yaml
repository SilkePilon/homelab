---
# ─────────────────────────────────────────────────────────────────────────────
# RustFS — S3-compatible store for groepshike's photos and videos (Payload's
# storage-s3 plugin). The same server the site uses in dev and CI.
# Service DNS: groepshike-s3:9000 (S3 API). The bucket is private: the site
# serves files itself at /api/media/file/… and /api/videos/file/….
# The web console (9001) is not exposed.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: groepshike-s3
  namespace: groepshike
  labels:
    app.kubernetes.io/name: groepshike-s3
spec:
  replicas: 1
  # ReadWriteOnce PVC — only one writer at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: groepshike-s3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: groepshike-s3
    spec:
      # The image runs as rustfs (UID/GID 10001).
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: groepshike-secret
                  key: S3_ACCESS_KEY_ID
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: groepshike-secret
                  key: S3_SECRET_ACCESS_KEY
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: groepshike-s3-data
        - name: logs
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: groepshike-s3
  namespace: groepshike
  labels:
    app.kubernetes.io/name: groepshike-s3
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: groepshike-s3
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
# Creates the bucket if it is missing. An Argo CD PostSync hook: runs after
# every sync, and does nothing when the bucket exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: groepshike-s3-bucket
  namespace: groepshike
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: create-bucket
          image: amazon/aws-cli:2.40.3
          env:
            - name: HOME
              value: /tmp
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: groepshike-secret
                  key: S3_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: groepshike-secret
                  key: S3_SECRET_ACCESS_KEY
          command: ["/bin/sh", "-c"]
          args:
            - >-
              aws --endpoint-url http://groepshike-s3:9000 s3api head-bucket --bucket groepshike-media
              || aws --endpoint-url http://groepshike-s3:9000 s3api create-bucket --bucket groepshike-media
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
